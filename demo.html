et my friend.” 어디에서였죠? “at a cafe.” 언제였죠? “yesterday.” “I met my friend at a cafe yesterday.” 다시 여러분 차례입니다. 제가 정답을 가리고 있다고 생각하시고 한 번 말해보세요.","자, 처음에 보셨던 문장으로 돌아가겠습니다. “I practiced English with my friend at a cafe yesterday.” 이제는 한 덩어리로 보이지 않으시죠? “I practiced English.” 기본 문장, “with my friend.” 함께한 사람, “at a cafe.” 장소, “yesterday.” 시간. 오늘 배운 건 긴 문장을 외우는 기술이 아니라, 짧은 문장부터 시작하는 순서입니다.","여러분들이 다음에 영어 문장이 막히면 먼저 이렇게 질문해 보세요. “누가? 무엇을 했는데?” 그 답부터 영어로 말하고 그다음에 장소나 시간을 붙이시면 됩니다. 오늘 문장 하나를 직접 완성하셨다면 충분합니다. 다음에는 그 짧은 문장을 질문과 대답으로 이어 가는 연습도 해보겠습니다. 오늘도 함께해 주셔서 감사합니다."],"B":["여러분, 영어 문장 하나를 보여드릴게요. “I practiced English with my friend at a cafe yesterday.” 무슨 뜻인지 대충은 아시겠죠? 그런데 제가 지금 이 문장을 화면에서 지워버리고 “직접 말해보세요” 하면 어떨까요? 갑자기 머릿속이 하얘지시는 분들이 있을 겁니다. 영어를 모르는 게 아니라, 문장 안에 들어갈 정보가 한꺼번에 떠오르기 때문이에요.","오늘은 그 문제를 해결해 볼 겁니다. 어려운 문법 이름을 열 개 외우는 강의가 아니에요. 영어 문장을 만들 때 어디서 시작하고, 어느 순간에 정보를 붙이면 되는지 딱 한 가지 원리를 익혀보겠습니다. 마지막에는 지금보다 긴 문장을 여러분이 직접 만들어보실 거예요. 그러니까 화면만 보지 마시고, 제가 멈추는 순간에 실제로 입을 열어보세요.","먼저 여러분이 택배 상자를 하나 보낸다고 생각해 봅시다. 택배 상자 안에 아무것도 없는데 배송지와 보내는 날짜부터 적어놓으면 정작 무엇을 보내는지 빠져 있겠죠. 영어 문장도 비슷합니다. 사람에게 가장 먼저 전달해야 할 건 “누가 무엇을 했느냐”예요. 장소와 시간은 그 뒤에 붙는 추가 설명입니다. 물론 실제 영어의 어순은 여러 가지가 있지만, 오늘은 초보자분들이 말을 시작할 때 쓸 수 있는 쉬운 기준 하나를 만드는 겁니다.","자, 아까 문장으로 다시 가보겠습니다. “I practiced English with my friend at a cafe yesterday.” 여기서 어제라는 말도 있고 친구라는 말도 있고 카페라는 말도 있습니다. 지금은 그걸 전부 잠깐 치워보세요. 딱 하나만 묻겠습니다. 누가 무엇을 했죠? 제가 했죠. 뭘 했죠? 영어를 연습했죠. “I practiced English.” 끝입니다. 여러분, 이거 벌써 문장입니다. 이 세 덩어리만으로 하고 싶은 말의 중심이 전달됐어요.","그러면 이제 상대방이 궁금해하겠죠. 누구하고 했는데? 친구하고요. 영어로 “with my friend.” 이거를 뒤에 붙여봅시다. “I practiced English with my friend.” 이번에는 어디에서 했냐고 물어봅니다. 카페에서 했죠. “at a cafe.” 합치면 “I practiced English with my friend at a cafe.” 마지막으로 언제요? 어제요. “yesterday.” 그래서 최종적으로 “I practiced English with my friend at a cafe yesterday.” 이 긴 문장을 처음부터 한 번에 만든 적이 없습니다. 짧은 문장을 네 번에 걸쳐 조금씩 구체적으로 설명한 거예요.","여러분, 여기서 중요한 사실이 하나 있습니다. 뒤에 붙는 정보는 항상 네 칸을 모두 채워야 하는 게 아닙니다. 친구가 누구인지 말할 필요가 없다면 “with my friend”를 빼도 됩니다. 장소를 이야기할 필요가 없다면 카페도 빼면 되고요. 영어 문장은 빈칸 채우기 시험지가 아닙니다. 상대에게 전달하고 싶은 정보가 있으면 그때 하나씩 붙이는 겁니다. 그리고 장소와 시간을 말하는 위치도 상황과 강조에 따라 달라질 수 있어요. 오늘은 가장 따라 하기 쉬운 기본 형태로 연습하고 있다는 것만 기억해주세요.","자, 첫 번째 연습을 해보겠습니다. “나는 매일 저녁 집에서 영어를 공부한다.” 이걸 통째로 영어로 바꿔보라고 하면 어려우실 수 있습니다. 그러니까 우리가 방금 했던 것처럼 정보를 잠깐 지워보세요. 집에서, 매일 저녁에. 둘 다 일단 치워봅시다. 무엇이 남았죠? “나는 영어를 공부한다.” 그렇죠. 주어 I, 공부한다 study, 영어를 English. “I study English.” 여러분도 한 번 말해보세요. “I study English.”","여기서 바로 끝내셔도 괜찮아요. 그런데 조금 더 자세하게 말하고 싶습니다. 어디에서 공부한다고 했죠? 집에서요. 집에서는 “at home.” 이제 뒤에 붙여보세요. “I study English at home.” 너무 좋습니다. 마지막으로 매일 저녁이죠. “every evening.” 자, 전부 다 붙여볼까요? “I study English at home every evening.” 이번에는 화면을 보지 마시고 한 번 더요. 나는 매일 저녁 집에서 영어 공부를 한다. “I study English at home every evening.”","어때요? 문장이 처음보다 길어졌죠. 그런데 여러분들이 외워야 할 새로운 공식이 막 늘어난 건 아닙니다. 제가 말을 던지는 순서가 같아요. 먼저 “I study English.” 그다음 “at home.” 마지막 “every evening.” 이 세 번의 동작만 했습니다. 영어를 길게 말한다는 건 긴 문장을 처음부터 머릿속에 다 적어놓고 읽는 일이 아니라, 짧은 말을 하면서 필요한 정보를 이어 붙이는 일에 가깝습니다.","그런데 여기서 이런 질문을 하시는 분이 있을 것 같아요. “선생님, 영어는 주어, 동사, 목적어 순서라고 하셨잖아요. 그러면 모든 문장에 목적어가 있어야 하나요?” 좋은 질문입니다. 그렇지 않습니다. 제가 “I walk.”라고 말하면요. 나는 걷는다. 이미 문장입니다. 뭘 걷는다는 말이 필요하지 않죠. 반면에 “I bought.”라고만 말하면 대화 상대가 뭘 샀는지 궁금할 수 있습니다. 그래서 “I bought a gift.”라고 말하는 거예요. 오늘은 문법 용어를 깊게 들어가지 않고, 동사에 따라 뒤에 필요한 말이 다르다는 정도만 이해하시면 충분합니다.","그러면 두 번째 연습으로 가보겠습니다. “나는 매일 아침 공원에서 걷는다.” 이번에는 물건을 사는 것도 아니고 영어를 공부하는 것도 아닙니다. 내가 걷는 거죠. “I walk.” 여기까지 해보세요. “I walk.” 어디서 걷나요? 공원에서요. “in the park.” 붙여보겠습니다. “I walk in the park.” 언제요? 매일 아침입니다. “every morning.” 이제 완성입니다. “I walk in the park every morning.” 보세요. 목적어를 억지로 집어넣지 않았는데도 자연스럽게 문장이 완성됐습니다.","이번에는 조금 더 실제 생활에 가까운 문장으로 해볼게요. “나는 어제 작은 가게에서 딸을 위해 선물을 샀다.” 조금 길죠? 처음부터 번역하지 마세요. 딸을 위해서, 작은 가게에서, 어제. 추가 정보는 잠깐 치우고 누가 뭘 했는지부터 보겠습니다. 내가 선물을 샀죠. “I bought a gift.” 여러분 차례예요. “I bought a gift.”","그런데 누구를 위해 샀죠? 딸을 위해서입니다. “for my daughter.” 이제 “I bought a gift for my daughter.” 어디에서였죠? 작은 가게에서요. “at a small shop.” “I bought a gift for my daughter at a small shop.” 마지막으로 언제 샀나요? 어제요. “yesterday.” 한 번에 읽어볼게요. “I bought a gift for my daughter at a small shop yesterday.” 어려워 보였던 문장이 네 조각으로 나뉘니까 어떤 말을 먼저 해야 하는지 조금 더 보이지 않으신가요?","이쯤 되면 “그럼 무조건 방법, 장소, 시간, 이유 순서로만 말하면 되나요?” 하고 궁금하실 수 있습니다. 그렇지는 않아요. 예를 들어 “I bought a gift for my daughter yesterday at a small shop.”도 문맥에 따라 쓸 수 있습니다. 무엇을 강조하는지에 따라 추가 정보의 위치는 달라질 수 있습니다. 그러니까 오늘 배우는 건 영어 어순의 모든 예외를 암기하는 방법이 아니라, 말이 막혔을 때 가장 먼저 짧은 문장으로 출발하는 방법입니다. 순서가 조금 달라진다고 해서 이미 잘 전달되는 문장을 무조건 틀렸다고 보실 필요는 없습니다.","자, 이제부터는 제가 도와드리지 않고 여러분이 직접 만들어보겠습니다. 첫 번째 문제입니다. “나는 어제 카페에서 친구를 만났다.” 세 초만 드릴게요. 누가 누구를 만났죠? 하나, 둘, 셋. “I met my friend.” 어디에서였죠? “at a cafe.” 언제라고 했죠? “yesterday.” 합쳐보겠습니다. “I met my friend at a cafe yesterday.” 자, 정답을 보신 뒤에는 꼭 한번 눈을 돌리고 혼자 말씀해 보세요.","두 번째 문제는 조금 바꿔볼게요. “나는 주말마다 집에서 딸과 영어를 연습한다.” 처음에 뭘 잡아야 되죠? “I practice English.” 여기까지 먼저 말해보세요. 이제 누구와 함께하는지, “with my daughter.” 장소는 “at home.” 시간은 “every weekend.” 붙여보겠습니다. “I practice English with my daughter at home every weekend.” 이번에는 문장을 적지 않고 말해보는 겁니다. 중간에 틀리시면 한 번 끊었다가 다시 시작하면 됩니다. 오늘은 시험이 아니니까요.","마지막으로 처음 화면에 있던 긴 문장을 다시 가져오겠습니다. “I practiced English with my friend at a cafe yesterday.” 이제 어떠신가요? 무슨 정보를 먼저 붙여야 할지 조금 더 보이시죠? 누가 무엇을 했는데? “I practiced English.” 누구와? “with my friend.” 어디서? “at a cafe.” 언제? “yesterday.” 처음에는 이 문장이 커다란 영어 덩어리처럼 보였지만, 지금은 짧은 문장 하나에 세 가지 설명이 붙은 것으로 보일 겁니다.","여러분, 오늘 기억하실 건 딱 하나예요. “누가 무엇을 했는데?” 그 말부터 영어로 꺼내보세요. 그리고 필요한 사람, 장소, 시간 같은 정보를 뒤에 조금씩 더해보세요. 긴 문장을 한 번에 만들지 않아도 됩니다. 오늘 여러분들은 짧은 문장을 길게 만들었고, 제가 질문을 던졌을 때 직접 답하기까지 해봤습니다. 바로 그게 오늘 이 영상에서 가져가셨으면 하는 성과입니다. 다음에 영어로 말하다 막히더라도 처음부터 다시 전부 번역하지 마시고, 앞의 짧은 문장으로 돌아가 보세요. 오늘도 함께해 주셔서 감사합니다."]},"A1":{"A":["영어 소리를 들었는데 아는 단어가 하나도 안 들린 것 같은 경험 있으시죠? 오늘은 내 리스닝이 어디에서 막히는지 세 단계로 확인해 보겠습니다.","먼저 이 문장을 들어보세요. “What do you want to do?” 뜻은 “뭘 하고 싶으세요?”입니다. 글자로 보면 what, do, you, want, to, do를 다 알고 있는데, 빠르게 들으면 단어 사이가 붙어서 낯설게 느껴질 수 있어요.","진단은 간단합니다. 첫째, 소리만 듣고 의미를 알아본다. 둘째, 자막을 보고 어떤 단어가 있었는지 확인한다. 셋째, 자막을 덮고 같은 문장을 다시 듣는다. 자막을 본 뒤 들리기 시작했다면, 아예 모르는 단어의 문제만은 아닐 수 있습니다.","오늘은 듣기 문제를 세 가지로 나눠 봤습니다. 단어를 모르는지, 소리가 붙어서 낯선지, 아니면 의미를 따라가는 속도가 느린지. 다음에 못 들리는 문장을 만나면 먼저 어디에서 막혔는지 확인해 보세요."],"B":["“분명히 아는 단어인데 왜 들을 때는 모르겠지?” 오늘 이 질문을 해결해 보겠습니다. 지금부터 같은 문장을 두 번 들을 거예요. 이해가 안 된다고 바로 포기하지 마세요. 오늘 목표는 리스닝 실력이 갑자기 좋아지는 게 아니라, **내가 어디에서 막히는지 알아내는 것**입니다.","문장은 “What do you want to do?”입니다. “당신은 무엇을 하고 싶으세요?”라는 뜻이죠. 화면으로 보면 대부분 읽을 수 있을 겁니다. 그런데 자연스러운 대화에서는 여러 단어가 매끄럽게 이어져, 책에서 보던 모습과 다르게 들립니다. 발음은 사람마다 다르지만, 중요한 건 단어 사이에 매번 쉬는 시간이 있는 게 아니라는 사실이에요.","첫 번째 테스트입니다. 소리만 듣고 무슨 뜻인지 말해보세요. 두 번째, 문장을 눈으로 읽고 의미를 확인합니다. 세 번째, 자막을 보지 않고 다시 들어보세요. 처음에는 안 들렸는데 이제 들리나요? 그렇다면 소리의 연결을 익히는 연습이 도움이 될 수 있습니다. 여전히 뜻이 생각나지 않나요? 그때는 단어와 표현 자체를 먼저 익혀야 할 수도 있어요.","마지막 확인입니다. 아까 그 질문 “What do you want to do?”를 한 번 더 들어보세요. 이제 필요한 연습이 무엇인지 조금 더 분명해졌나요? **못 듣는 이유를 먼저 나누고, 그 이유에 맞게 연습하는 것.** 오늘 가져갈 건 바로 이 기준입니다."]},"A2":{"A":["오늘도 영어 공부할 시간이 없으셨나요? 길게 공부하기 어렵다면 질문 하나로 10분을 채워보겠습니다. 준비물은 영어 문장 하나뿐입니다.","오늘 질문은 “What do you do after work?” 퇴근하고 무엇을 하세요?입니다. 먼저 아주 짧게 “I cook dinner.” 저녁을 만들어요. 여기서 끝내지 말고, “I cook dinner for my family.” 우리 가족을 위해 만든다고 한 가지를 더 붙여보세요.","이제 같은 질문에 내 대답을 만들어 보세요. “I take a walk.” 산책해요. “I watch TV.” TV 봐요. 좋아하는 표현 하나만 선택해도 됩니다. 그리고 상대방에게 “How about you?”라고 되물어보세요.","오늘은 질문 하나, 대답 한 문장, 정보 한 조각, 되묻기까지 했습니다. 10분 연습은 여기서 마칩니다."],"B":["10분도 시간이 없어서 영어를 못 한다고 느껴지시나요? 사실 오늘은 열 개의 문장을 외우지 않을 겁니다. **질문 하나에 내 대답을 만드는 연습**만 해볼게요. 그 한 문장이 대화에서 나올 수 있으면, 오늘 10분은 충분히 의미 있습니다.","제가 먼저 묻겠습니다. “What do you do after work?” 퇴근하고 뭐 하세요? 이때 멋진 대답은 필요 없습니다. “I cook dinner.” 저녁 만들어요. 이것만 말해도 대답은 끝난 겁니다. 자, 이제 정보를 하나 붙여볼게요. “I cook dinner with my husband.” 남편과 저녁을 만들어요. 여러분이라면 with my family, at home처럼 바꿀 수도 있겠죠.","여기서 대화가 한 번 더 이어지게 하는 표현이 있습니다. “How about you?” 당신은요? 자, 제가 다시 질문할게요. “What do you do after work?” 여러분은 짧게 답하고, 정보 하나를 더하고, 마지막에 “How about you?”라고 물어보세요. 시간을 드릴게요. 세 문장을 완벽하게 말하려고 하지 말고 멈추지 않는 연습을 해보세요.","첫 질문으로 돌아가겠습니다. “What do you do after work?” 조금 전보다 대답이 자연스럽게 나오나요? 질문 하나, 짧은 대답, 한마디 더, 그리고 되묻기. **내일은 같은 틀에 질문만 바꿔보세요.** 새로운 문장 열 개보다, 오늘 실제로 말해본 한 문장이 남을 수 있습니다."]},"H0":{"A":["영어 동사 get을 외울 때 “얻다” 하나만 기억하면 막히는 경우가 많습니다. 오늘은 get을 어떤 변화의 도착점으로 생각해 보겠습니다.","“I get home at six.” 여섯 시에 집에 도착해요. “I get tired after work.” 퇴근하면 피곤해져요. 하나는 장소에 도착하고, 다른 하나는 상태가 바뀌었습니다. 둘 다 get이 어떤 결과에 이르는 느낌으로 쓰였죠.","직접 말해볼게요. “나는 일곱 시에 집에 도착해요.” “I get home at seven.” “나는 저녁에 피곤해져요.” “I get tired in the evening.” 다른 의미의 get을 두 번 썼습니다.","오늘은 get을 단어 뜻 하나로만 외우지 않고, 문장에서 일어나는 변화를 함께 봤습니다. 다음 문장을 만나면 그 결과가 무엇인지 찾아보세요."],"B":["get은 ‘얻다’라고 외웠는데 “I get home”은 왜 집을 얻는다는 뜻이 아닐까요? 이런 순간이 오면 영어가 갑자기 어려워집니다. 오늘은 get의 뜻을 더 많이 외우기보다, **문장 안에서 결과가 어떻게 달라지는지** 느껴보겠습니다.","첫 번째는 “I get home at six.”입니다. 여섯 시에 집에 도착합니다. 여기서는 내가 어느 장소에 이른 거죠. 두 번째는 “I get tired after work.” 퇴근하고 피곤해집니다. 여기서는 내 상태가 피곤한 쪽으로 바뀌었습니다. get이 항상 같은 한국어 한 단어로 번역되는 건 아니지만, 어떤 상태나 지점에 이르는 모습을 떠올리면 이해가 쉬워질 때가 있습니다.","이제 제가 상황을 줄게요. 일을 끝내고 집 문 앞에 도착했습니다. “I get home.” 그 뒤로 피곤해졌어요. “I get tired.” 마지막으로 잠들기 전에는 “I get sleepy.” 졸리게 돼요. 세 문장을 천천히 이어서 말해보세요. 장소가 하나, 상태가 둘입니다. 뜻을 세 개 따로 외우기 전에 장면을 떠올리며 말하는 거예요.","처음 질문으로 돌아가 보겠습니다. “I get home”이 왜 ‘집을 얻는다’가 아니었죠? 문장 전체에서 어디에 도착하거나 어떤 상태가 되는지를 보는 것이 더 도움이 되기 때문입니다. 오늘은 get의 모든 용법을 끝낸 것이 아니라, **새로운 get 문장을 만날 때 스스로 해석할 수 있는 실마리 하나**를 얻었습니다."]},"H1":{"A":["영어 어순을 공부했는데 실제 대화에서는 문장이 안 나오시나요? 오늘은 가장 단순한 문장에 정보를 붙여보겠습니다.","“I bought coffee.” 나는 커피를 샀다. 여기에 “at a cafe”를 붙이면 카페에서 샀고, “this morning”을 붙이면 오늘 아침에 샀다는 뜻입니다. “I bought coffee at a cafe this morning.”이 됩니다.","이제 제가 묻겠습니다. “What did you buy?” 무엇을 샀나요? “I bought coffee.” “Where?” 어디에서요? “At a cafe.” “When?” 언제요? “This morning.” 짧게 대답해도 됩니다.","오늘은 영어 어순을 시험문제로만 풀지 않고, 질문에 맞게 정보를 꺼내는 데 사용했습니다. 한 문장만 말하더라도 실제 대화로 연결해 보세요."],"B":["영어 어순을 이해했다는 것과, 대화 중에 그 어순을 바로 꺼내는 것은 조금 다른 일입니다. 오늘은 제가 질문하는 사람이고 여러분이 대답하는 사람입니다. **정답을 읽는 게 아니라 직접 말해보는 3턴 챌린지**를 해보겠습니다.","먼저 기본 문장 하나를 준비합니다. “I bought coffee.” 커피를 샀어요. 여기까지 됐다면 충분합니다. 첫 질문입니다. “What did you buy?” 무엇을 샀나요? 바로 말해보세요. “I bought coffee.” 두 번째 질문, “Where did you buy it?” 어디서 샀나요? “At a cafe.” 세 번째 질문, “When did you buy it?” 언제 샀나요? “This morning.” 여기까지 세 번 답하셨죠?","이제 잘게 나눈 답을 하나로 묶어보겠습니다. “I bought coffee at a cafe this morning.” 길어 보이지만 새로 만든 말은 없습니다. 아까 세 질문에 이미 대답했거든요. 다시 한번 제 질문에 답해보세요. “What did you buy?” “Where?” “When?” 이번엔 답을 연결해서 한 번에 말해보세요.","처음에는 어순 규칙이 머리에서만 돌았습니다. 지금은 질문에 대답하고, 그 답을 한 문장으로 연결했습니다. **주어와 동사로 시작해 필요한 장소·시간만 덧붙이는 것.** 오늘 그 차이를 직접 느끼셨다면 챌린지는 성공입니다."]},"H2":{"A":["영어를 삼 일 하다가 그만두셨나요? 의지가 약해서라고만 생각하지 마세요. 시작할 일이 너무 크면 다시 하기 어려울 수 있습니다.","오늘은 30일 공부 계획을 아주 작게 시작해 보겠습니다. 하루 목표는 문장 하나를 소리 내서 세 번 말하는 것입니다. 예를 들어 “I take a walk every morning.” 나는 매일 아침 산책해요.","어제 연습한 문장을 오늘 다시 한 번 말하고, 오늘 문장 하나를 추가합니다. 종이에 날짜와 실제로 말한 횟수를 체크해 보세요. 시간이 부족한 날은 문장 하나만 말해도 됩니다.","30일 동안 매일 새로운 문장 30개를 외워야 하는 건 아닙니다. 작은 행동을 반복하고, 실제로 얼마나 했는지 기록해 보세요."],"B":["영어 공부를 시작할 때 가장 어려운 건 첫날이 아니라, 일주일 뒤에 다시 책을 펴는 일일 수 있습니다. 오늘은 ‘매일 한 시간’ 같은 큰 목표 대신, **30일 동안 계속할 수 있는 아주 작은 실험**을 함께 설계해 볼게요.","첫날은 문장 하나입니다. “I take a walk every morning.” 나는 매일 아침 산책해요. 이 문장을 소리 내서 세 번 말합니다. 그게 전부예요. 둘째 날은 어제 문장을 한 번 말하고, 오늘 내 생활에 맞는 문장을 하나 골라봅니다. “I drink coffee after lunch.” 점심 먹고 커피를 마셔요. 이렇게 이미 한 말을 짧게 꺼내는 연습을 먼저 합니다.","중요한 건 달력에 동그라미를 그리는 것보다, 실제로 어떤 행동을 했는지 체크하는 겁니다. 종이에 ‘날짜, 말한 문장, 소리 낸 횟수’ 세 칸을 만들어 보세요. 하루를 놓쳤다면 다음 날 그대로 이어가면 됩니다. 한 번 비었다고 처음부터 다시 시작할 필요는 없습니다.","30일 뒤에 모든 영어가 유창해질 거라고 약속하지는 않겠습니다. 대신 오늘 여러분은 작은 실험을 시작할 수 있습니다. “I take a walk every morning.” 지금 세 번 말해보세요. **계획을 크게 세우는 것보다, 오늘 실제로 입을 움직인 한 번**이 더 분명한 출발점입니다."]}};
function draft(b){
 const s=SCRIPT_SAMPLES[choice]||SCRIPT_SAMPLES['A0'];
 const paragraphs=s[b?'B':'A'].slice();
 // Reflect the selected research direction through an actual spoken practice prompt.
 const directions={
   1:'여기서 한 가지 확인할게요. 영어를 말하다 멈춰도 괜찮습니다. 지금 들은 예문을 처음부터 외우려고 하지 말고, 어디에서 막혔는지 찾아 그 부분만 다시 말해보세요.',
   2:'이제 이 문장을 실제 대화라고 생각해보세요. 상대가 묻는 질문을 듣고 짧게 답한 다음, 알고 있는 정보를 하나만 더 붙여보세요. 다음 질문까지 이어가면 충분합니다.'
 };
 if(direction!==0)paragraphs.splice(Math.max(2,paragraphs.length-1),0,directions[direction]);
 return paragraphs.join('\n\n').replace(/\*\*/g,'');
}
function link(stepTo,text){return `<button class="back" onclick="go(${stepTo})">← ${text}</button>`}
function evidence(content){return `<div class="bottom"><details><summary>판단 근거 · 데이터 보기</summary><div class="details-copy">${content}</div></details></div>`}
function go(n){step=n;window.scrollTo(0,0);render()}
function setGoal(v){goal=v;render()}
function setChoice(v){if(choice!==v){choice=v;built=false;showB=true;finalScript=''}render()}
function setDirection(v){if(direction!==v){direction=v;built=false;showB=true;finalScript=''}render()}
function createB(){built=true;showB=true;render()}
function viewB(v){showB=v;render()}
function confirmDraft(){finalScript=draft(built&&showB);go(4)}
function download(){let a=document.createElement('a');let u=URL.createObjectURL(new Blob([finalScript],{type:'text/markdown;charset=utf-8'}));a.href=u;a.download='demo_final_script.md';a.click();setTimeout(()=>URL.revokeObjectURL(u),700)}
function render(){let body='';const rec=selected();
if(step===0){body=`<div class="hero"><h1>내 채널에 맞는 다음 주제 찾기</h1></div>
<div class="goal">${['신규 유입','신뢰 형성'].map(x=>`<button class="${goal===x?'selected':''}" onclick="setGoal('${x}')">${x}</button>`).join('')}</div>
<div class="chat"><textarea id="topic" placeholder="어떤 주제를 고민하고 있나요?"></textarea><div class="actions"><button class="primary" onclick="go(1)">주제 찾기 ↑</button></div></div>`}
else if(step===1){const a=all().filter(x=>x.source==='A'),b=all().filter(x=>x.source==='B');const cards=items=>items.map(x=>`<label class="topic ${x.key===choice?'on':''}"><input type="radio" name="candidate" ${x.key===choice?'checked':''} onchange="setChoice('${x.key}')"><span>${safe(x.rank)}순위 · ${safe(x.title)}</span></label>`).join('');body=`<h2>다음 영상, 무엇을 만들까요?</h2><div class="group">A · 내 채널 분석</div>${cards(a)}<div class="group">B · 외부 웹 조사</div>${cards(b)}<p class="hint">${safe(rec.reason).slice(0,170)}</p><div class="actions"><button class="primary" onclick="go(2)">이 주제 심층 조사</button></div>${evidence(`<p><b>선정 이유</b> · ${safe(rec.reason)}</p><p><b>비교</b> · ${safe(rec.tradeoff)}</p><p>검색량·예상 조회수로 검증된 결과는 아닙니다.</p>`)}${link(0,'주제 찾기')}`}
else if(step===2){body=`<h2>영상 방향 선택</h2><div class="pick">${safe(rec.title)}</div><div class="group">이 영상을 만드는 방향</div>${dirItems.map((d,i)=>`<label class="topic ${direction===i?'on':''}"><input type="radio" name="direction" onchange="setDirection(${i})" ${direction===i?'checked':''}><span>${i+1}. ${safe(d[0])}</span></label>`).join('')}<div class="pick">${safe(dirItems[direction][1])}</div><div class="actions"><button class="primary" onclick="go(3)">이 방향으로 대본 만들기</button></div>${evidence('<p>시장 영상과 자막 수치는 모두 시연용 데이터입니다. 실제 수집은 수행하지 않았습니다.</p>')}${link(1,'주제 비교')}`}
else if(step===3){body=`<h2>대본 확인</h2><p class="hint">실제 말하듯 읽을 수 있는 주제별 예시 대본입니다. AI 호출 없이 작동합니다.</p><div class="draft-title">${safe(rec.title)}</div>`;
if(!built){body+=`<div class="actions"><button class="primary" onclick="createB()">Draft B 만들기</button></div><h3 class="scripthead">Draft A · 예시 원고</h3><div class="manuscript">${safe(draft(false))}</div>`}
else{body+=`<div class="goal"><button class="${!showB?'selected':''}" onclick="viewB(false)">Draft A</button><button class="${showB?'selected':''}" onclick="viewB(true)">Draft B</button></div><div class="manuscript">${safe(draft(showB))}</div><div class="actions"><button class="primary" onclick="confirmDraft()">이 원고로 최종 확정</button></div>`}
body+=evidence('<p>Draft B는 도입 문제 회수, 즉시 수행 연습, 완결형 마무리를 강화한 예시입니다. 실제 AI 비평은 작동하지 않습니다.</p>')+link(2,'영상 방향')}
