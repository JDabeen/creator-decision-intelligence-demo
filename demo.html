<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator Decision Intelligence · Demo</title><style>*{box-sizing:border-box}body{background:#101112;color:#eee;font:16px/1.7 system-ui,'Malgun Gothic',sans-serif;margin:0}main{max-width:780px;margin:0 auto;padding:80px 24px}h1{font-size:32px;letter-spacing:-1.5px}h2{font-size:25px}p{color:#aaa}button{cursor:pointer;background:#222;color:#eee;border:1px solid #454545;border-radius:12px;padding:12px 18px;font:inherit;margin:5px}button:hover{background:#353535}button.selected,.primary{background:#f2f2f2;color:#141414}.panel{border:1px solid #333;background:#191b1c;border-radius:16px;padding:22px;margin:14px 0}.small{font-size:13px;color:#999}textarea{width:100%;background:#222;color:white;border:1px solid #444;border-radius:14px;padding:18px;font:inherit}details{border-top:1px solid #333;margin-top:35px;padding-top:15px;color:#aaa}summary{cursor:pointer}#steps{color:#999;font-size:13px;margin-bottom:50px}.right{text-align:right}.tag{color:#bbb;font-size:12px}</style></head><body><main><div class="small">CREATOR DECISION INTELLIGENCE / SYNTHETIC DEMO</div><div id="steps"></div><section id="screen"></section></main><script>
let stage=0,goal='신규 유입',choice=0,script=1;
const options=[{source:'A · 채널 데이터',title:'외운 영어를 실제 대화로 바꾸는 법',desc:'과거 어순 관련 영상의 반응을 바탕으로 문장 확장 훈련을 검토합니다.',risk:'시청자의 실제 발화 성과는 검증되지 않았습니다.'},{source:'B · 외부 조사',title:'리스닝이 말하기로 이어지지 않는 이유',desc:'듣기에서 발화로 이어지는 구체적 전환 실험을 제안합니다.',risk:'시장 근거 표본이 작아 수요를 단정할 수 없습니다.'},{source:'A · 시장 공백',title:'여행 영어, 직원의 질문부터 듣고 답하기',desc:'문장 암기를 대화형 실습으로 전환하는 제작 방향입니다.',risk:'여행 주제는 경쟁이 높을 수 있습니다.'}];
const steps=['주제 찾기','추천 비교','심층 조사','대본'];
function render(){document.getElementById('steps').textContent=(stage+1)+' / 4 · '+steps[stage];let h='';
if(stage===0){h='<div style="margin-top:60px;text-align:center"><h1>내 채널에 맞는 다음 주제 찾기</h1></div><div style="text-align:center"><button id="g1" onclick="goal=\'신규 유입\';render()">신규 유입</button><button id="g2" onclick="goal=\'신뢰 형성\';render()">신뢰 형성</button></div><div class="panel"><textarea rows="3" placeholder="원하는 주제를 입력하거나 비워두세요."></textarea><div class="right"><button class="primary" onclick="stage=1;render()">주제 찾기</button></div></div>';}
if(stage===1){h='<h2>제작 후보 비교</h2><p>서로 다른 근거에서 나온 제안을 비교하세요.</p>'; options.forEach((o,i)=>h+='<div class="panel"><div class="tag">'+o.source+'</div><h3>'+o.title+'</h3><p>'+o.desc+'</p><button '+(choice===i?'class="selected"':'')+' onclick="choice='+i+';render()">'+(choice===i?'선택됨':'이 주제 선택')+'</button></div>');h+='<div class="right"><button class="primary" onclick="stage=2;render()">선택한 주제 더 알아보기</button></div><details><summary>판단 근거 · 데이터 보기</summary>본 데모의 수치와 영상 반응은 실제 조사를 재현한 합성 예시입니다. 연결 링크가 있더라도 미래 조회수를 예측하지 않습니다.</details>'}
if(stage===2){h='<h2>선택한 주제의 방향</h2><div class="panel"><div class="tag">FOCUSED RESEARCH · MOCK</div><h3>'+options[choice].title+'</h3><p>핵심 차별점: 설명을 들은 후 직접 한 문장을 말해보게 만드는 구조</p><p>예상 구성: 문제 제기 → 예문 비교 → 직접 말하기 → 처음 질문 회수</p></div><div class="right"><button class="primary" onclick="stage=3;render()">대본 확인하기</button></div><details><summary>판단 근거 · 데이터 보기</summary>'+options[choice].risk+' 본 데모는 실제 자막을 분석하지 않습니다.</details>'}
if(stage===3){h='<h2>어떤 원고로 촬영할까요?</h2><div class="panel"><div class="tag">'+(script===0?'DRAFT A':'DRAFT B')+'</div><h3>'+options[choice].title+'</h3><p>여러분, 영어 문장을 외웠는데 대화할 때 말이 멈춘 적 있으신가요?</p><p>오늘은 하나의 짧은 문장으로 질문을 듣고, 답을 만들고, 한 번 더 이어 가는 연습을 해보겠습니다.</p><p>'+(script===0?'짧은 문장부터 천천히 시작해 보세요.':'처음의 질문으로 돌아가 볼까요? 이제 질문에 답하고 한마디를 더 보탤 수 있습니다. 영어 대화를 길게 만드는 첫걸음은 바로 이 연결입니다.')+'</p></div><button '+(script===0?'class="selected"':'')+' onclick="script=0;render()">Draft A</button><button '+(script===1?'class="selected"':'')+' onclick="script=1;render()">Draft B</button><button class="primary" onclick="let t=document.querySelector(\'.panel\').innerText;let a=document.createElement(\'a\');a.href=URL.createObjectURL(new Blob([t],{type:\'text/plain;charset=utf-8\'}));a.download=\'final_script_demo.txt\';a.click()">최종 원고 저장</button><details><summary>판단 근거 · 데이터 보기</summary>시연 대본은 실제 AI 생성 결과가 아닌 예시 텍스트입니다.</details>'}
if(stage>0)h+='<div style="margin-top:40px"><button onclick="stage--;render()">이전 단계</button><button onclick="stage=0;render()">새로 시작</button></div>';document.getElementById('screen').innerHTML=h;if(stage===0)document.getElementById(goal==='신규 유입'?'g1':'g2').classList.add('selected');}
render();
</script></body></html>
