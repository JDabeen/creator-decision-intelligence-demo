f": "기존 검증 영상과의 직접 연결은 약하다.", "demand": "국내 실제 소비 표본 부족"}], "Hermes": [{"rank": 1, "title": "동사 이미지로 문장 만드는 5분 실습", "route": "승자 심화", "reason": "검증된 동사 영상의 학습 과제를 더 구체화한다.", "tradeoff": "기존 동사 영상과 학습 보상의 차이를 분명히 해야 한다.", "demand": "경쟁 영상 관련 자료 4건 · 근거 원문 검토 필요"}, {"rank": 2, "title": "영어 어순을 실제 대화에서 응용하는 챌린지", "route": "승자 심화", "reason": "강한 어순 관심을 실제 참여형 형식으로 확장하는 실험이다.", "tradeoff": "관심이 챌린지 시청으로 전이될지는 미검증이다.", "demand": "현재 검색 관심도 미측정"}, {"rank": 3, "title": "50대 초보 영어가 30일 지속되는 방식", "route": "신규 실험", "reason": "학습 지속의 문제를 다룬다.", "tradeoff": "기존 문장 학습 중심 영상보다 도달 근거가 약하다.", "demand": "주제 수요 불확실"}]}, "mock_decisions": [{"topic": "영어 어순 시리즈 후속편", "predicted": "기존 주제 연결성이 강함 · 조회수 예측 보류", "released": "2026-07-01", "views_28d": 8200, "comments_28d": 67, "status": "가상 28일 관측"}, {"topic": "영어 공부 루틴", "predicted": "신규 실험 · 신뢰 형성 가설", "released": "2026-08-08", "views_28d": 1080, "comments_28d": 8, "status": "가상 28일 관측"}], "illustrative_market_interest": [{"keyword": "영어 어순", "youtube_search_interest_relative": 86, "scope": "동일 가상 비교 묶음"}, {"keyword": "영어 듣기", "youtube_search_interest_relative": 78, "scope": "동일 가상 비교 묶음"}, {"keyword": "영어 동사", "youtube_search_interest_relative": 62, "scope": "동일 가상 비교 묶음"}, {"keyword": "영어 공부 루틴", "youtube_search_interest_relative": 34, "scope": "동일 가상 비교 묶음"}]};
let step=0,goal='신규 유입',choice='A0',direction=0,built=false,showB=true,finalScript='';
const root=document.getElementById('screen');
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const all=()=>[...DATA.recommendations.A.map((x,i)=>({key:'A'+i,source:'A',...x})),...DATA.recommendations.Hermes.map((x,i)=>({key:'H'+i,source:'B',...x}))];
const selected=()=>all().find(x=>x.key===choice)||all()[0];
const dirItems=[['핵심 원리 → 바로 적용','복잡한 개념을 한 문장 기준으로 정리한 뒤 직접 말하기'],['흔한 실수 → 교정 실험','같은 질문에 다시 답하면서 어디서 막혔는지 확인하기'],['생활 상황 → 3턴 대화','문장 하나를 질문·대답·추가 질문으로 이어보기']];
function draft(b){const t=selected().title,d=dirItems[direction][0];return b?
`# ${t}\n\n첫 질문\n“I like coffee.”는 이해하시죠? “Do you like coffee?”라고 들었을 때 3초 안에 대답이 나오나요?\n\n오늘의 원리\n아는 문장 하나를 대답으로 만들고, 내 정보 한 조각을 붙인 뒤, 한 번 더 되물어보세요.\n\n직접 해보기\nDo you like coffee? — Yes, I do. I drink it every morning. How about you?\n\n마지막 확인\n처음 질문으로 돌아갑니다. 이번에는 바로 대답하고, 한마디를 덧붙이고, 되물어 보세요. 질문 → 대답 → 한마디 더. 이 세 단계를 해냈다면 오늘은 성공입니다.`:
`# ${t}\n\n도입\n영어를 배웠는데 막상 말하려면 막히는 순간이 있죠? 오늘은 ${d}를 연습합니다.\n\n핵심 원리\n“I like coffee.”라는 문장을 한 번 말하고, 질문인 “Do you like coffee?”로 바꿔보세요.\n\n연습\n“Yes, I do.”라고 답하고 다른 단어로 바꿔 연습해 보세요.\n\n마무리\n오늘은 하나의 문장을 다양한 방식으로 말해봤습니다. 작은 문장을 실제 내 말로 만들어 보세요.`}
function link(stepTo,text){return `<button class="back" onclick="go(${stepTo})">← ${text}</button>`}
function evidence(content){return `<div class="bottom"><details><summary>판단 근거 · 데이터 보기</summary><div class="details-copy">${content}</div></details></div>`}
function go(n){step=n;window.scrollTo(0,0);render()}
function setGoal(v){goal=v;render()}
function setChoice(v){choice=v;render()}
function setDirection(v){direction=v;render()}
function createB(){built=true;showB=true;render()}

function confirmDraft(){finalScript=draft(built&&showB);go(4)}
function download(){let a=document.createElement('a');let u=URL.createObjectURL(new Blob([finalScript],{type:'text/markdown;charset=utf-8'}));a.href=u;a.download='demo_final_script.md';a.click();setTimeout(()=>URL.revokeObjectURL(u),700)}
function render(){let body='';const rec=selected();
if(step===0){body=`<div class="hero"><h1>내 채널에 맞는 다음 주제 찾기</h1></div>
<div class="goal">${['신규 유입','신뢰 형성'].map(x=>`<button class="${goal===x?'selected':''}" onclick="setGoal('${x}')">${x}</button>`).join('')}</div>
<div class="chat"><textarea id="topic" placeholder="어떤 주제를 고민하고 있나요?"></textarea><div class="actions"><button class="primary" onclick="go(1)">주제 찾기 ↑</button></div></div>`}
else if(step===1){const a=all().filter(x=>x.source==='A'),b=all().filter(x=>x.source==='B');const cards=items=>items.map(x=>`<label class="topic ${x.key===choice?'on':''}"><input type="radio" name="candidate" ${x.key===choice?'checked':''} onchange="setChoice('${x.key}')"><span>${safe(x.rank)}순위 · ${safe(x.title)}</span></label>`).join('');body=`<h2>다음 영상, 무엇을 만들까요?</h2><div class="group">A · 내 채널 분석</div>${cards(a)}<div class="group">B · 외부 웹 조사</div>${cards(b)}<p class="hint">${safe(rec.reason).slice(0,170)}</p><div class="actions"><button class="primary" onclick="go(2)">이 주제 심층 조사</button></div>${evidence(`<p><b>선정 이유</b> · ${safe(rec.reason)}</p><p><b>비교</b> · ${safe(rec.tradeoff)}</p><p>검색량·예상 조회수로 검증된 결과는 아닙니다.</p>`)}${link(0,'주제 찾기')}`}
else if(step===2){body=`<h2>영상 방향 선택</h2><div class="pick">${safe(rec.title)}</div><div class="group">이 영상을 만드는 방향</div>${dirItems.map((d,i)=>`<label class="topic ${direction===i?'on':''}"><input type="radio" name="direction" onchange="setDirection(${i})" ${direction===i?'checked':''}><span>${i+1}. ${safe(d[0])}</span></label>`).join('')}<div class="pick">${safe(dirItems[direction][1])}</div><div class="actions"><button class="primary" onclick="go(3)">이 방향으로 대본 만들기</button></div>${evidence('<p>시장 영상과 자막 수치는 모두 시연용 데이터입니다. 실제 수집은 수행하지 않았습니다.</p>')}${link(1,'주제 비교')}`}
else if(step===3){body=`<h2>대본 확인</h2><div class="draft-title">${safe(rec.title)}</div>`;
if(!built){body+=`<div class="actions"><button class="primary" onclick="createB()">Draft B 만들기</button></div><h3>Draft A</h3><div class="manuscript">${safe(draft(false))}</div>`}
else{body+=`<div class="goal"><button class="${!showB?'selected':''}" onclick="viewB(false)">Draft A</button><button class="${showB?'selected':''}" onclick="viewB(true)">Draft B</button></div><div class="manuscript">${safe(draft(showB))}</div><div class="actions"><button class="primary" onclick="confirmDraft()">이 원고로 최종 확정</button></div>`}
body+=evidence('<p>Draft B는 도입 문제 회수, 즉시 수행 연습, 완결형 마무리를 강화한 예시입니다. 실제 AI 비평은 작동하지 않습니다.</p>')+link(2,'영상 방향')}
else{body=`<h2>최종 대본이 준비됐습니다</h2><div class="manuscript">${safe(finalScript||draft(false))}</div><div class="actions"><button class="primary" onclick="download()">Markdown 저장</button></div>${evidence('<p>이 원고는 가상 예시이며 실제 AI로 생성한 결과가 아닙니다.</p>')}${link(0,'처음부터 다시 체험')}`}
root.innerHTML=body}
render();</script></body></html>
