장을 매번 새로 만드는 게 아니라 익숙한 말에 필요한 정보만 더하는 겁니다. 같은 틀로 다른 장면에 적응하는 연습이죠.","틀려도 좋습니다. 필요한 정보가 무엇인지 생각한 다음 한 문장만 말해보세요.","마지막으로 여러분 상황에 맞는 답을 만듭니다. 지금 떠오르는 자기 이야기 하나를 한국어로 먼저 말하고, 오늘 표현으로 바꿔보세요. (10초)","자, 처음 질문을 다시 가져오겠습니다. Where are you staying?","(5초) 지금은 처음보다 어떤 말부터 해야 하는지 조금 더 보이시나요?","오늘 배운 건 모든 영어를 한꺼번에 외우는 방법이 아닙니다. Where / How long / Sorry? 세 가지 반응으로 여행 질문에 대답하기.","여러분이 오늘 직접 답했던 문장 하나만 기억해보세요. 그 한 문장을 자기 상황으로 다시 바꿔 말하면 공부가 조금씩 대화가 됩니다.","한 번 더 직접 말해보세요. 처음보다 조금이라도 더 쉽게 나왔다면 오늘 연습에 의미가 있습니다.","틀려도 돼요. 멈추지만 마세요. 오늘도 함께해 주셔서 감사합니다."],"B":["여러분, 이런 상황에서 영어가 갑자기 멈춘 적 있으세요?","오늘의 장면은 여행 중 호텔 근처에서 처음 만난 사람의 질문입니다.","제가 먼저 질문 하나를 드릴게요. Where are you staying?","(3초) 여러분이라면 어떻게 대답하시겠어요? 바로 말이 안 나와도 괜찮습니다. 여기서 시작할 거예요.","오늘은 I'm staying 하나를 중심으로 연습하겠습니다. 아주 많은 문법을 한꺼번에 외우지 않고, 이미 아는 표현을 조금씩 바꿔 써볼 겁니다.","영상이 끝날 때는 처음 질문을 다시 들었을 때 짧게라도 3초 안에 대답하기. 눈으로 보지만 마시고 실제로 입을 열어보세요.","처음 질문은 마지막에 다시 가져옵니다. 그때는 제가 답을 먼저 알려주지 않을 테니 얼마나 달라졌는지 직접 확인해보세요.","틀려도 괜찮습니다. 말을 시작하고 한 번 더 시도하는 데 집중해보세요.","먼저 뜻과 말의 순서를 충분히 이해해보고, 그다음 입으로 연결해보겠습니다.","1번째 연습입니다. 첫 단어를 듣고 장소 말하기.","원어민 질문을 듣는다고 생각해보세요. \"Where are you staying?\" (3초)","Where를 들으면 어디인지 먼저 떠올리세요.","오늘의 핵심 표현은 \"I'm staying\"입니다. 먼저 천천히 한 번, 이번에는 자연스럽게 한 번 더 말해봅니다. (×3)","지금부터 한국어를 보고 먼저 3초 동안 영어로 말해보세요. 바로 정답을 읽지 마시고, 대답한 다음 제가 보여드리는 문장을 따라 말하는 순서입니다.","1번. \"역 근처에요\" (3초)\nI'm staying near the station.\n이 문장, 이번에는 천천히 함께 말해볼까요? I'm staying near the station. (×3)\n잘하셨어요. 앞의 핵심을 그대로 두고 필요한 정보만 바꿔 넣었습니다.","2번. \"작은 호텔에요\" (3초)\nI'm staying at a small hotel.\n이 문장, 이번에는 천천히 함께 말해볼까요? I'm staying at a small hotel. (×3)","3번. \"친구 집에서요\" (3초)\nI'm staying with a friend.\n이 문장, 이번에는 천천히 함께 말해볼까요? I'm staying with a friend. (×3)","4번. \"딸네에서요\" (3초)\nI'm staying with my daughter.\n이 문장, 이번에는 천천히 함께 말해볼까요? I'm staying with my daughter. (×3)","5번. \"해변 근처에요\" (3초)\nI'm staying near the beach.\n이 문장, 이번에는 천천히 함께 말해볼까요? I'm staying near the beach. (×3)\n마지막 문장까지 잘하셨습니다. 이제 힌트를 잠깐 내려놓고 다시 말해보세요.","자, 여기까지는 제가 정답을 보여드렸습니다. 이제 바로 답을 보여주지 않겠습니다. 처음 질문으로 돌아갈게요. Where are you staying? (5초)","처음에 막히더라도 전부 처음부터 번역하려고 하지 마세요. 지금 배운 말 중에 가장 쉬운 것 하나부터 꺼내보세요.","발음도 한 가지만 살펴보겠습니다. 문장을 읽을 때 모든 단어를 따로 끊으려고 하면 대화에서 다른 소리로 들릴 수 있어요. 방금 본 'I'm staying near the station.'을 천천히, 그다음 자연스럽게 이어서 두 번 말해보세요.","같은 질문에 짧게 대답하는 것도 좋습니다. 길게 정확히 말하느라 멈추기보다 먼저 의미를 전달하고, 필요하다면 정보를 한 가지 더해 보세요.","2번째 연습입니다. How long을 듣고 기간 말하기.","원어민 질문을 듣는다고 생각해보세요. \"How long are you staying?\" (3초)","How long은 얼마나 오래인지 묻는 말이에요. 기간을 덧붙입니다.","오늘의 핵심 표현은 \"I'm staying\"입니다. 먼저 천천히 한 번, 이번에는 자연스럽게 한 번 더 말해봅니다. (×3)","지금부터 한국어를 보고 먼저 3초 동안 영어로 말해보세요. 바로 정답을 읽지 마시고, 대답한 다음 제가 보여드리는 문장을 따라 말하는 순서입니다.","1번. \"3일 동안이요\" (3초)\nI'm staying for three days.\n이 문장, 이번에는 천천히 함께 말해볼까요? I'm staying for three days. (×3)\n잘하셨어요. 앞의 핵심을 그대로 두고 필요한 정보만 바꿔 넣었습니다.","2번. \"일주일이요\" (3초)\nI'm staying for a week.\n이 문장, 이번에는 천천히 함께 말해볼까요? I'm staying for a week. (×3)","3번. \"5박이요\" (3초)\nI'm staying for five nights.\n이 문장, 이번에는 천천히 함께 말해볼까요? I'm staying for five nights. (×3)","4번. \"2주 동안이요\" (3초)\nI'm staying for two weeks.\n이 문장, 이번에는 천천히 함께 말해볼까요? I'm staying for two weeks. (×3)","5번. \"한 달 동안이요\" (3초)\nI'm staying for a month.\n이 문장, 이번에는 천천히 함께 말해볼까요? I'm staying for a month. (×3)\n마지막 문장까지 잘하셨습니다. 이제 힌트를 잠깐 내려놓고 다시 말해보세요.","자, 여기까지는 제가 정답을 보여드렸습니다. 이제 바로 답을 보여주지 않겠습니다. 처음 질문으로 돌아갈게요. How long are you staying? (5초)","처음에 막히더라도 전부 처음부터 번역하려고 하지 마세요. 지금 배운 말 중에 가장 쉬운 것 하나부터 꺼내보세요.","발음도 한 가지만 살펴보겠습니다. 문장을 읽을 때 모든 단어를 따로 끊으려고 하면 대화에서 다른 소리로 들릴 수 있어요. 방금 본 'I'm staying for three days.'을 천천히, 그다음 자연스럽게 이어서 두 번 말해보세요.","같은 질문에 짧게 대답하는 것도 좋습니다. 길게 정확히 말하느라 멈추기보다 먼저 의미를 전달하고, 필요하다면 정보를 한 가지 더해 보세요.","3번째 연습입니다. 못 들었을 때 대화 되살리기.","원어민 질문을 듣는다고 생각해보세요. \"Could you say that again?\" (3초)","첫 단어도 못 들었을 때는 억지로 답하지 말고 한 번 더 부탁해 보세요.","오늘의 핵심 표현은 \"I'm staying\"입니다. 먼저 천천히 한 번, 이번에는 자연스럽게 한 번 더 말해봅니다. (×3)","지금부터 한국어를 보고 먼저 3초 동안 영어로 말해보세요. 바로 정답을 읽지 마시고, 대답한 다음 제가 보여드리는 문장을 따라 말하는 순서입니다.","1번. \"다시 한 번요?\" (3초)\nSorry?\n이 문장, 이번에는 천천히 함께 말해볼까요? Sorry? (×3)\n잘하셨어요. 앞의 핵심을 그대로 두고 필요한 정보만 바꿔 넣었습니다.","2번. \"다시 말해주실래요?\" (3초)\nCould you say that again?\n이 문장, 이번에는 천천히 함께 말해볼까요? Could you say that again? (×3)","3번. \"천천히 부탁해요\" (3초)\nCould you speak more slowly, please?\n이 문장, 이번에는 천천히 함께 말해볼까요? Could you speak more slowly, please? (×3)","4번. \"역 근처에서 3일 묵어요\" (3초)\nI'm staying near the station for three days.\n이 문장, 이번에는 천천히 함께 말해볼까요? I'm staying near the station for three days. (×3)","5번. \"당신은요?\" (3초)\nHow about you?\n이 문장, 이번에는 천천히 함께 말해볼까요? How about you? (×3)\n마지막 문장까지 잘하셨습니다. 이제 힌트를 잠깐 내려놓고 다시 말해보세요.","자, 여기까지는 제가 정답을 보여드렸습니다. 이제 바로 답을 보여주지 않겠습니다. 처음 질문으로 돌아갈게요. Could you say that again? (5초)","처음에 막히더라도 전부 처음부터 번역하려고 하지 마세요. 지금 배운 말 중에 가장 쉬운 것 하나부터 꺼내보세요.","발음도 한 가지만 살펴보겠습니다. 문장을 읽을 때 모든 단어를 따로 끊으려고 하면 대화에서 다른 소리로 들릴 수 있어요. 방금 본 'Sorry?'을 천천히, 그다음 자연스럽게 이어서 두 번 말해보세요.","같은 질문에 짧게 대답하는 것도 좋습니다. 길게 정확히 말하느라 멈추기보다 먼저 의미를 전달하고, 필요하다면 정보를 한 가지 더해 보세요.","이제는 세 가지 연습을 섞어보겠습니다. 앞에서는 어떤 연습인지 알고 답했지만, 실제 대화에서는 질문이 섞여서 나옵니다.","첫 번째 질문입니다. Where are you staying? (5초)\n제가 먼저 대답하지 않을 테니 본인이 만들 수 있는 가장 짧은 영어로 말해보세요.","두 번째 질문. How long are you staying? (5초)\n아까 연습했던 표현을 그대로 다시 꺼내면 됩니다.","세 번째 질문. Could you say that again? (5초)\n이번에는 문장을 조금 더 자연스럽게 이어보세요.","문장을 매번 새로 만드는 게 아니라 익숙한 말에 필요한 정보만 더하는 겁니다. 같은 틀로 다른 장면에 적응하는 연습이죠.","한 번 더 해볼게요. 이번에는 제가 질문을 빠르게 하는 상황이라고 생각해보세요. 안 들렸다면 'Sorry?' 또는 'Could you say that again?'이라고 말하고, 다시 들은 뒤 짧게 대답하는 겁니다.","마지막으로 여러분 상황에 맞는 답을 만듭니다. 지금 떠오르는 자기 이야기 하나를 한국어로 먼저 말하고, 오늘 표현으로 바꿔보세요. (10초)","자, 처음 질문을 다시 가져오겠습니다. Where are you staying?","(5초) 지금은 처음보다 어떤 말부터 해야 하는지 조금 더 보이시나요?","오늘 배운 건 모든 영어를 한꺼번에 외우는 방법이 아닙니다. Where / How long / Sorry? 세 가지 반응으로 여행 질문에 대답하기.","여러분이 오늘 직접 답했던 문장 하나만 기억해보세요. 그 한 문장을 자기 상황으로 다시 바꿔 말하면 공부가 조금씩 대화가 됩니다.","처음에는 질문 앞에서 멈췄지만, 지금은 짧게 대답하고 필요하면 다시 물을 수도 있습니다. 오늘 영상에서 가져갈 성과는 바로 그 차이입니다.","틀려도 돼요. 멈추지만 마세요. 오늘도 함께해 주셔서 감사합니다."]},"A1":{"A":["여러분, 이런 상황에서 영어가 갑자기 멈춘 적 있으세요?","오늘의 장면은 공원에서 외국인과 잠깐 나누는 산책 이야기입니다.","제가 먼저 질문 하나를 드릴게요. Where do you take a walk?","(3초) 여러분이라면 어떻게 대답하시겠어요? 바로 말이 안 나와도 괜찮습니다. 여기서 시작할 거예요.","오늘은 I take a walk 하나를 중심으로 연습하겠습니다. 아주 많은 문법을 한꺼번에 외우지 않고, 이미 아는 표현을 조금씩 바꿔 써볼 겁니다.","영상이 끝날 때는 어디서·언제·왜를 듣고 원래 문장에 한 칸만 붙여 이어 말하기. 눈으로 보지만 마시고 실제로 입을 열어보세요.","먼저 하나씩 이해한 다음 직접 따라 말해보겠습니다.","틀려도 괜찮습니다. 말을 시작하고 한 번 더 시도하는 데 집중해보세요.","먼저 뜻과 말의 순서를 충분히 이해해보고, 그다음 입으로 연결해보겠습니다.","1번째 연습입니다. Where가 들리면 장소.","원어민 질문을 듣는다고 생각해보세요. \"Where do you take a walk?\" (3초)","처음 말한 I take a walk는 그대로 두고 어디서만 말해 보세요.","오늘의 핵심 표현은 \"I take a walk\"입니다. 먼저 천천히 한 번, 이번에는 자연스럽게 한 번 더 말해봅니다. (×2)","지금부터 한국어를 보고 먼저 3초 동안 영어로 말해보세요. 바로 정답을 읽지 마시고, 대답한 다음 제가 보여드리는 문장을 따라 말하는 순서입니다.","1번. \"공원에서요\" (3초)\nI take a walk in the park.\n이 문장, 이번에는 천천히 함께 말해볼까요? I take a walk in the park. (×2)\n잘하셨어요. 앞의 핵심을 그대로 두고 필요한 정보만 바꿔 넣었습니다.","2번. \"강가에서요\" (3초)\nI take a walk by the river.\n이 문장, 이번에는 천천히 함께 말해볼까요? I take a walk by the river. (×2)","3번. \"동네 한 바퀴요\" (3초)\nI take a walk around my neighborhood.\n이 문장, 이번에는 천천히 함께 말해볼까요? I take a walk around my neighborhood. (×2)","4번. \"호수 주변에서요\" (3초)\nI take a walk around the lake.\n이 문장, 이번에는 천천히 함께 말해볼까요? I take a walk around the lake. (×2)","5번. \"숲길에서요\" (3초)\nI take a walk along the forest trail.\n이 문장, 이번에는 천천히 함께 말해볼까요? I take a walk along the forest trail. (×2)\n마지막 문장까지 잘하셨습니다. 이제 힌트를 잠깐 내려놓고 다시 말해보세요.","자, 여기까지는 제가 정답을 보여드렸습니다. 이제 바로 답을 보여주지 않겠습니다. 처음 질문으로 돌아갈게요. Where do you take a walk? (5초)","처음에 막히더라도 전부 처음부터 번역하려고 하지 마세요. 지금 배운 말 중에 가장 쉬운 것 하나부터 꺼내보세요.","2번째 연습입니다. When이 들리면 시간.","원어민 질문을 듣는다고 생각해보세요. \"When do you take a walk?\" (3초)","새 문장을 처음부터 만들기보다 뒤에 시간을 하나 붙입니다.","오늘의 핵심 표현은 \"I take a walk\"입니다. 먼저 천천히 한 번, 이번에는 자연스럽게 한 번 더 말해봅니다. (×2)","지금부터 한국어를 보고 먼저 3초 동안 영어로 말해보세요. 바로 정답을 읽지 마시고, 대답한 다음 제가 보여드리는 문장을 따라 말하는 순서입니다.","1번. \"매일 아침\" (3초)\nI take a walk every morning.\n이 문장, 이번에는 천천히 함께 말해볼까요? I take a walk every morning. (×2)\n잘하셨어요. 앞의 핵심을 그대로 두고 필요한 정보만 바꿔 넣었습니다.","2번. \"저녁 식사 후\" (3초)\nI take a walk after dinner.\n이 문장, 이번에는 천천히 함께 말해볼까요? I take a walk after dinner. (×2)","3번. \"주말마다\" (3초)\nI take a walk on weekends.\n이 문장, 이번에는 천천히 함께 말해볼까요? I take a walk on weekends. (×2)","4번. \"아침 식사 전에\" (3초)\nI take a walk before breakfast.\n이 문장, 이번에는 천천히 함께 말해볼까요? I take a walk before breakfast. (×2)","5번. \"밤마다\" (3초)\nI take a walk at night.\n이 문장, 이번에는 천천히 함께 말해볼까요? I take a walk at night. (×2)\n마지막 문장까지 잘하셨습니다. 이제 힌트를 잠깐 내려놓고 다시 말해보세요.","자, 여기까지는 제가 정답을 보여드렸습니다. 이제 바로 답을 보여주지 않겠습니다. 처음 질문으로 돌아갈게요. When do you take a walk? (5초)","처음에 막히더라도 전부 처음부터 번역하려고 하지 마세요. 지금 배운 말 중에 가장 쉬운 것 하나부터 꺼내보세요.","3번째 연습입니다. Why가 들리면 이유.","원어민 질문을 듣는다고 생각해보세요. \"Why do you take a walk?\" (3초)","이유를 말할 때는 to 다음에 하려는 행동을 붙일 수 있습니다.","오늘의 핵심 표현은 \"I take a walk\"입니다. 먼저 천천히 한 번, 이번에는 자연스럽게 한 번 더 말해봅니다. (×2)","지금부터 한국어를 보고 먼저 3초 동안 영어로 말해보세요. 바로 정답을 읽지 마시고, 대답한 다음 제가 보여드리는 문장을 따라 말하는 순서입니다.","1번. \"건강하려고요\" (3초)\nI take a walk to stay healthy.\n이 문장, 이번에는 천천히 함께 말해볼까요? I take a walk to stay healthy. (×2)\n잘하셨어요. 앞의 핵심을 그대로 두고 필요한 정보만 바꿔 넣었습니다.","2번. \"바람 쐬려고요\" (3초)\nI take a walk to get some fresh air.\n이 문장, 이번에는 천천히 함께 말해볼까요? I take a walk to get some fresh air. (×2)","3번. \"쉬려고요\" (3초)\nI take a walk to relax.\n이 문장, 이번에는 천천히 함께 말해볼까요? I take a walk to relax. (×2)","4번. \"머리를 식히려고요\" (3초)\nI take a walk to clear my head.\n이 문장, 이번에는 천천히 함께 말해볼까요? I take a walk to clear my head. (×2)","5번. \"운동하려고요\" (3초)\nI take a walk to get some exercise.\n이 문장, 이번에는 천천히 함께 말해볼까요? I take a walk to get some exercise. (×2)\n마지막 문장까지 잘하셨습니다. 이제 힌트를 잠깐 내려놓고 다시 말해보세요.","자, 여기까지는 제가 정답을 보여드렸습니다. 이제 바로 답을 보여주지 않겠습니다. 처음 질문으로 돌아갈게요. Why do you take a walk? (5초)","처음에 막히더라도 전부 처음부터 번역하려고 하지 마세요. 지금 배운 말 중에 가장 쉬운 것 하나부터 꺼내보세요.","이제는 세 가지 연습을 섞어보겠습니다. 앞에서는 어떤 연습인지 알고 답했지만, 실제 대화에서는 질문이 섞여서 나옵니다.","첫 번째 질문입니다. What do you do in the morning? (5초)\n제가 먼저 대답하지 않을 테니 본인이 만들 수 있는 가장 짧은 영어로 말해보세요.","두 번째 질문. Where? (5초)\n아까 연습했던 표현을 그대로 다시 꺼내면 됩니다.","세 번째 질문. When? (5초)\n이번에는 문장을 조금 더 자연스럽게 이어보세요.","문장을 매번 새로 만드는 게 아니라 익숙한 말에 필요한 정보만 더하는 겁니다. 같은 틀로 다른 장면에 적응하는 연습이죠.","틀려도 좋습니다. 필요한 정보가 무엇인지 생각한 다음 한 문장만 말해보세요.","마지막으로 여러분 상황에 맞는 답을 만듭니다. 지금 떠오르는 자기 이야기 하나를 한국어로 먼저 말하고, 오늘 표현으로 바꿔보세요. (10초)","자, 처음 질문을 다시 가져오겠습니다. Where do you take a walk?","(5초) 지금은 처음보다 어떤 말부터 해야 하는지 조금 더 보이시나요?","오늘 배운 건 모든 영어를 한꺼번에 외우는 방법이 아닙니다. 하나의 핵심 문장에 장소·시간·이유만 덧붙여 질문 3개에 답하기.","여러분이 오늘 직접 답했던 문장 하나만 기억해보세요. 그 한 문장을 자기 상황으로 다시 바꿔 말하면 공부가 조금씩 대화가 됩니다.","한 번 더 직접 말해보세요. 처음보다 조금이라도 더 쉽게 나왔다면 오늘 연습에 의미가 있습니다.","틀려도 돼요. 멈추지만 마세요. 오늘도 함께해 주셔서 감사합니다."],"B":["여러분, 이런 상황에서 영어가 갑자기 멈춘 적 있으세요?","오늘의 장면은 공원에서 외국인과 잠깐 나누는 산책 이야기입니다.","제가 먼저 질문 하나를 드릴게요. Where do you take a walk?","(3초) 여러분이라면 어떻게 대답하시겠어요? 바로 말이 안 나와도 괜찮습니다. 여기서 시작할 거예요.","오늘은 I take a walk 하나를 중심으로 연습하겠습니다. 아주 많은 문법을 한꺼번에 외우지 않고, 이미 아는 표현을 조금씩 바꿔 써볼 겁니다.","영상이 끝날 때는 어디서·언제·왜를 듣고 원래 문장에 한 칸만 붙여 이어 말하기. 눈으로 보지만 마시고 실제로 입을 열어보세요.","처음 질문은 마지막에 다시 가져옵니다. 그때는 제가 답을 먼저 알려주지 않을 테니 얼마나 달라졌는지 직접 확인해보세요.","틀려도 괜찮습니다. 말을 시작하고 한 번 더 시도하는 데 집중해보세요.","먼저 뜻과 말의 순서를 충분히 이해해보고, 그다음 입으로 연결해보겠습니다.","1번째 연습입니다. Where가 들리면 장소.","원어민 질문을 듣는다고 생각해보세요. \"Where do you take a walk?\" (3초)","처음 말한 I take a walk는 그대로 두고 어디서만 말해 보세요.","오늘의 핵심 표현은 \"I take a walk\"입니다. 먼저 천천히 한 번, 이번에는 자연스럽게 한 번 더 말해봅니다. (×3)","지금부터 한국어를 보고 먼저 3초 동안 영어로 말해보세요. 바로 정답을 읽지 마시고, 대답한 다음 제가 보여드리는 문장을 따라 말하는 순서입니다.","1번. \"공원에서요\" (3초)\nI take a walk in the park.\n이 문장, 이번에는 천천히 함께 말해볼까요? I take a walk in the park. (×3)\n잘하셨어요. 앞의 핵심을 그대로 두고 필요한 정보만 바꿔 넣었습니다.","2번. \"강가에서요\" (3초)\nI take a walk by the river.\n이 문장, 이번에는 천천히 함께 말해볼까요? I take a walk by the river. (×3)","3번. \"동네 한 바퀴요\" (3초)\nI take a walk around my neighborhood.\n이 문장, 이번에는 천천히 함께 말해볼까요? I take a walk around my neighborhood. (×3)","4번. \"호수 주변에서요\" (3초)\nI take a walk around the lake.\n이 문장, 이번에는 천천히 함께 말해볼까요? I take a walk around the lake. (×3)","5번. \"숲길에서요\" (3초)\nI take a walk along the forest trail.\n이 문장, 이번에는 천천히 함께 말해볼까요? I take a walk along the forest trail. (×3)\n마지막 문장까지 잘하셨습니다. 이제 힌트를 잠깐 내려놓고 다시 말해보세요.","자, 여기까지는 제가 정답을 보여드렸습니다. 이제 바로 답을 보여주지 않겠습니다. 처음 질문으로 돌아갈게요. Where do you take a walk? (5초)","처음에 막히더라도 전부 처음부터 번역하려고 하지 마세요. 지금 배운 말 중에 가장 쉬운 것 하나부터 꺼내보세요.","발음도 한 가지만 살펴보겠습니다. 문장을 읽을 때 모든 단어를 따로 끊으려고 하면 대화에서 다른 소리로 들릴 수 있어요. 방금 본 'I take a walk in the park.'을 천천히, 그다음 자연스럽게 이어서 두 번 말해보세요.","같은 질문에 짧게 대답하는 것도 좋습니다. 길게 정확히 말하느라 멈추기보다 먼저 의미를 전달하고, 필요하다면 정보를 한 가지 더해 보세요.","2번째 연습입니다. When이 들리면 시간.","원어민 질문을 듣는다고 생각해보세요. \"When do you take a walk?\" (3초)","새 문장을 처음부터 만들기보다 뒤에 시간을 하나 붙입니다.","오늘의 핵심 표현은 \"I take a walk\"입니다. 먼저 천천히 한 번, 이번에는 자연스럽게 한 번 더 말해봅니다. (×3)","지금부터 한국어를 보고 먼저 3초 동안 영어로 말해보세요. 바로 정답을 읽지 마시고, 대답한 다음 제가 보여드리는 문장을 따라 말하는 순서입니다.","1번. \"매일 아침\" (3초)\nI take a walk every morning.\n이 문장, 이번에는 천천히 함께 말해볼까요? I take a walk every morning. (×3)\n잘하셨어요. 앞의 핵심을 그대로 두고 필요한 정보만 바꿔 넣었습니다.","2번. \"저녁 식사 후\" (3초)\nI take a walk after dinner.\n이 문장, 이번에는 천천히 함께 말해볼까요? I take a walk after dinner. (×3)","3번. \"주말마다\" (3초)\nI take a walk on weekends.\n이 문장, 이번에는 천천히 함께 말해볼까요? I take a walk on weekends. (×3)","4번. \"아침 식사 전에\" (3초)\nI take a walk before breakfast.\n이 문장, 이번에는 천천히 함께 말해볼까요? I take a walk before breakfast. (×3)","5번. \"밤마다\" (3초)\nI take a walk at night.\n이 문장, 이번에는 천천히 함께 말해볼까요? I take a walk at night. (×3)\n마지막 문장까지 잘하셨습니다. 이제 힌트를 잠깐 내려놓고 다시 말해보세요.","자, 여기까지는 제가 정답을 보여드렸습니다. 이제 바로 답을 보여주지 않겠습니다. 처음 질문으로 돌아갈게요. When do you take a walk? (5초)","처음에 막히더라도 전부 처음부터 번역하려고 하지 마세요. 지금 배운 말 중에 가장 쉬운 것 하나부터 꺼내보세요.","발음도 한 가지만 살펴보겠습니다. 문장을 읽을 때 모든 단어를 따로 끊으려고 하면 대화에서 다른 소리로 들릴 수 있어요. 방금 본 'I take a walk every morning.'을 천천히, 그다음 자연스럽게 이어서 두 번 말해보세요.","같은 질문에 짧게 대답하는 것도 좋습니다. 길게 정확히 말하느라 멈추기보다 먼저 의미를 전달하고, 필요하다면 정보를 한 가지 더해 보세요.","3번째 연습입니다. Why가 들리면 이유.","원어민 질문을 듣는다고 생각해보세요. \"Why do you take a walk?\" (3초)","이유를 말할 때는 to 다음에 하려는 행동을 붙일 수 있습니다.","오늘의 핵심 표현은 \"I take a walk\"입니다. 먼저 천천히 한 번, 이번에는 자연스럽게 한 번 더 말해봅니다. (×3)","지금부터 한국어를 보고 먼저 3초 동안 영어로 말해보세요. 바로 정답을 읽지 마시고, 대답한 다음 제가 보여드리는 문장을 따라 말하는 순서입니다.","1번. \"건강하려고요\" (3초)\nI take a walk to stay healthy.\n이 문장, 이번에는 천천히 함께 말해볼까요? I take a walk to stay healthy. (×3)\n잘하셨어요. 앞의 핵심을 그대로 두고 필요한 정보만 바꿔 넣었습니다.","2번. \"바람 쐬려고요\" (3초)\nI take a walk to get some fresh air.\n이 문장, 이번에는 천천히 함께 말해볼까요? I take a walk to get some fresh air. (×3)","3번. \"쉬려고요\" (3초)\nI take a walk to relax.\n이 문장, 이번에는 천천히 함께 말해볼까요? I take a walk to relax. (×3)","4번. \"머리를 식히려고요\" (3초)\nI take a walk to clear my head.\n이 문장, 이번에는 천천히 함께 말해볼까요? I take a walk to clear my head. (×3)","5번. \"운동하려고요\" (3초)\nI take a walk to get some exercise.\n이 문장, 이번에는 천천히 함께 말해볼까요? I take a walk to get some exercise. (×3)\n마지막 문장까지 잘하셨습니다. 이제 힌트를 잠깐 내려놓고 다시 말해보세요.","자, 여기까지는 제가 정답을 보여드렸습니다. 이제 바로 답을 보여주지 않겠습니다. 처음 질문으로 돌아갈게요. Why do you take a walk? (5초)","처음에 막히더라도 전부 처음부터 번역하려고 하지 마세요. 지금 배운 말 중에 가장 쉬운 것 하나부터 꺼내보세요.","발음도 한 가지만 살펴보겠습니다. 문장을 읽을 때 모든 단어를 따로 끊으려고 하면 대화에서 다른 소리로 들릴 수 있어요. 방금 본 'I take a walk to stay healthy.'을 천천히, 그다음 자연스럽게 이어서 두 번 말해보세요.","같은 질문에 짧게 대답하는 것도 좋습니다. 길게 정확히 말하느라 멈추기보다 먼저 의미를 전달하고, 필요하다면 정보를 한 가지 더해 보세요.","이제는 세 가지 연습을 섞어보겠습니다. 앞에서는 어떤 연습인지 알고 답했지만, 실제 대화에서는 질문이 섞여서 나옵니다.","첫 번째 질문입니다. What do you do in the morning? (5초)\n제가 먼저 대답하지 않을 테니 본인이 만들 수 있는 가장 짧은 영어로 말해보세요.","두 번째 질문. Where? (5초)\n아까 연습했던 표현을 그대로 다시 꺼내면 됩니다.","세 번째 질문. When? (5초)\n이번에는 문장을 조금 더 자연스럽게 이어보세요.","문장을 매번 새로 만드는 게 아니라 익숙한 말에 필요한 정보만 더하는 겁니다. 같은 틀로 다른 장면에 적응하는 연습이죠.","한 번 더 해볼게요. 이번에는 제가 질문을 빠르게 하는 상황이라고 생각해보세요. 안 들렸다면 'Sorry?' 또는 'Could you say that again?'이라고 말하고, 다시 들은 뒤 짧게 대답하는 겁니다.","마지막으로 여러분 상황에 맞는 답을 만듭니다. 지금 떠오르는 자기 이야기 하나를 한국어로 먼저 말하고, 오늘 표현으로 바꿔보세요. (10초)","자, 처음 질문을 다시 가져오겠습니다. Where do you take a walk?","(5초) 지금은 처음보다 어떤 말부터 해야 하는지 조금 더 보이시나요?","오늘 배운 건 모든 영어를 한꺼번에 외우는 방법이 아닙니다. 하나의 핵심 문장에 장소·시간·이유만 덧붙여 질문 3개에 답하기.","여러분이 오늘 직접 답했던 문장 하나만 기억해보세요. 그 한 문장을 자기 상황으로 다시 바꿔 말하면 공부가 조금씩 대화가 됩니다.","처음에는 질문 앞에서 멈췄지만, 지금은 짧게 대답하고 필요하면 다시 물을 수도 있습니다. 오늘 영상에서 가져갈 성과는 바로 그 차이입니다.","틀려도 돼요. 멈추지만 마세요. 오늘도 함께해 주셔서 감사합니다."]},"A2":{"A":["여러분, 이런 상황에서 영어가 갑자기 멈춘 적 있으세요?","오늘의 장면은 친구에게 어제 있었던 일을 이야기하는 상황입니다.","제가 먼저 질문 하나를 드릴게요. 어제 산책하려고 했는데 비가 와서 집에 있었어요.","(3초) 여러분이라면 어떻게 대답하시겠어요? 바로 말이 안 나와도 괜찮습니다. 여기서 시작할 거예요.","오늘은 I was going to …, but …, so … 하나를 중심으로 연습하겠습니다. 아주 많은 문법을 한꺼번에 외우지 않고, 이미 아는 표현을 조금씩 바꿔 써볼 겁니다.","영상이 끝날 때는 하고 싶었던 일과 생긴 일, 결국 한 일을 세 조각으로 엮어 말하기. 눈으로 보지만 마시고 실제로 입을 열어보세요.","먼저 하나씩 이해한 다음 직접 따라 말해보겠습니다.","틀려도 괜찮습니다. 말을 시작하고 한 번 더 시도하는 데 집중해보세요.","먼저 뜻과 말의 순서를 충분히 이해해보고, 그다음 입으로 연결해보겠습니다.","1번째 연습입니다. 하려고 했어요 — I was going to.","원어민 질문을 듣는다고 생각해보세요. \"What were you going to do?\" (3초)","지나간 계획을 말할 때 I was going to를 먼저 꺼내보세요.","오늘의 핵심 표현은 \"I was going to …, but …, so …\"입니다. 먼저 천천히 한 번, 이번에는 자연스럽게 한 번 더 말해봅니다. (×2)","지금부터 한국어를 보고 먼저 3초 동안 영어로 말해보세요. 바로 정답을 읽지 마시고, 대답한 다음 제가 보여드리는 문장을 따라 말하는 순서입니다.","1번. \"산책하려고 했어요\" (3초)\nI was going to take a walk.\n이 문장, 이번에는 천천히 함께 말해볼까요? I was going to take a walk. (×2)\n잘하셨어요. 앞의 핵심을 그대로 두고 필요한 정보만 바꿔 넣었습니다.","2번. \"친구를 만나려고 했어요\" (3초)\nI was going to meet a friend.\n이 문장, 이번에는 천천히 함께 말해볼까요? I was going to meet a friend. (×2)","3번. \"딸을 보러 가려고 했어요\" (3초)\nI was going to visit my daughter.\n이 문장, 이번에는 천천히 함께 말해볼까요? I was going to visit my daughter. (×2)","4번. \"코트를 사려고 했어요\" (3초)\nI was going to buy a coat.\n이 문장, 이번에는 천천히 함께 말해볼까요? I was going to buy a coat. (×2)","5번. \"운동하려고 했어요\" (3초)\nI was going to work out.\n이 문장, 이번에는 천천히 함께 말해볼까요? I was going to work out. (×2)\n마지막 문장까지 잘하셨습니다. 이제 힌트를 잠깐 내려놓고 다시 말해보세요.","자, 여기까지는 제가 정답을 보여드렸습니다. 이제 바로 답을 보여주지 않겠습니다. 처음 질문으로 돌아갈게요. What were you going to do? (5초)","처음에 막히더라도 전부 처음부터 번역하려고 하지 마세요. 지금 배운 말 중에 가장 쉬운 것 하나부터 꺼내보세요.","2번째 연습입니다. 그런데 — but.","원어민 질문을 듣는다고 생각해보세요. \"What happened?\" (3초)","그런데 무슨 일이 생겼나요? but 뒤에 한 장면을 붙입니다.","오늘의 핵심 표현은 \"I was going to …, but …, so …\"입니다. 먼저 천천히 한 번, 이번에는 자연스럽게 한 번 더 말해봅니다. (×2)","지금부터 한국어를 보고 먼저 3초 동안 영어로 말해보세요. 바로 정답을 읽지 마시고, 대답한 다음 제가 보여드리는 문장을 따라 말하는 순서입니다.","1번. \"그런데 비가 오기 시작했어요\" (3초)\nbut it started raining.\n이 문장, 이번에는 천천히 함께 말해볼까요? but it started raining. (×2)\n잘하셨어요. 앞의 핵심을 그대로 두고 필요한 정보만 바꿔 넣었습니다.","2번. \"그런데 너무 피곤했어요\" (3초)\nbut I was too tired.\n이 문장, 이번에는 천천히 함께 말해볼까요? but I was too tired. (×2)","3번. \"그런데 갑자기 일이 생겼어요\" (3초)\nbut something came up.\n이 문장, 이번에는 천천히 함께 말해볼까요? but something came up. (×2)","4번. \"그런데 너무 비쌌어요\" (3초)\nbut it was too expensive.\n이 문장, 이번에는 천천히 함께 말해볼까요? but it was too expensive. (×2)","5번. \"그런데 시간이 없었어요\" (3초)\nbut I didn't have time.\n이 문장, 이번에는 천천히 함께 말해볼까요? but I didn't have time. (×2)\n마지막 문장까지 잘하셨습니다. 이제 힌트를 잠깐 내려놓고 다시 말해보세요.","자, 여기까지는 제가 정답을 보여드렸습니다. 이제 바로 답을 보여주지 않겠습니다. 처음 질문으로 돌아갈게요. What happened? (5초)","처음에 막히더라도 전부 처음부터 번역하려고 하지 마세요. 지금 배운 말 중에 가장 쉬운 것 하나부터 꺼내보세요.","3번째 연습입니다. 그래서 — so.","원어민 질문을 듣는다고 생각해보세요. \"So what did you do?\" (3초)","결국 한 일을 so 뒤에 붙이면 이야기 한 편이 만들어집니다.","오늘의 핵심 표현은 \"I was going to …, but …, so …\"입니다. 먼저 천천히 한 번, 이번에는 자연스럽게 한 번 더 말해봅니다. (×2)","지금부터 한국어를 보고 먼저 3초 동안 영어로 말해보세요. 바로 정답을 읽지 마시고, 대답한 다음 제가 보여드리는 문장을 따라 말하는 순서입니다.","1번. \"그래서 집에 있었어요\" (3초)\nso I stayed home.\n이 문장, 이번에는 천천히 함께 말해볼까요? so I stayed home. (×2)\n잘하셨어요. 앞의 핵심을 그대로 두고 필요한 정보만 바꿔 넣었습니다.","2번. \"그래서 일찍 잤어요\" (3초)\nso I went to bed early.\n이 문장, 이번에는 천천히 함께 말해볼까요? so I went to bed early. (×2)","3번. \"그래서 대신 전화했어요\" (3초)\nso I called her instead.\n이 문장, 이번에는 천천히 함께 말해볼까요? so I called her instead. (×2)","4번. \"그래서 셔츠를 샀어요\" (3초)\nso I bought a shirt instead.\n이 문장, 이번에는 천천히 함께 말해볼까요? so I bought a shirt instead. (×2)","5번. \"그래서 다음 날로 미뤘어요\" (3초)\nso I put it off until the next day.\n이 문장, 이번에는 천천히 함께 말해볼까요? so I put it off until the next day. (×2)\n마지막 문장까지 잘하셨습니다. 이제 힌트를 잠깐 내려놓고 다시 말해보세요.","자, 여기까지는 제가 정답을 보여드렸습니다. 이제 바로 답을 보여주지 않겠습니다. 처음 질문으로 돌아갈게요. So what did you do? (5초)","처음에 막히더라도 전부 처음부터 번역하려고 하지 마세요. 지금 배운 말 중에 가장 쉬운 것 하나부터 꺼내보세요.","이제는 세 가지 연습을 섞어보겠습니다. 앞에서는 어떤 연습인지 알고 답했지만, 실제 대화에서는 질문이 섞여서 나옵니다.","첫 번째 질문입니다. What did you do yesterday? (5초)\n제가 먼저 대답하지 않을 테니 본인이 만들 수 있는 가장 짧은 영어로 말해보세요.","두 번째 질문. I was going to take a walk, but it started raining, so I stayed home. (5초)\n아까 연습했던 표현을 그대로 다시 꺼내면 됩니다.","세 번째 질문. So what did you do? (5초)\n이번에는 문장을 조금 더 자연스럽게 이어보세요.","문장을 매번 새로 만드는 게 아니라 익숙한 말에 필요한 정보만 더하는 겁니다. 같은 틀로 다른 장면에 적응하는 연습이죠.","틀려도 좋습니다. 필요한 정보가 무엇인지 생각한 다음 한 문장만 말해보세요.","마지막으로 여러분 상황에 맞는 답을 만듭니다. 지금 떠오르는 자기 이야기 하나를 한국어로 먼저 말하고, 오늘 표현으로 바꿔보세요. (10초)","자, 처음 질문을 다시 가져오겠습니다. 어제 산책하려고 했는데 비가 와서 집에 있었어요.","(5초) 지금은 처음보다 어떤 말부터 해야 하는지 조금 더 보이시나요?","오늘 배운 건 모든 영어를 한꺼번에 외우는 방법이 아닙니다. I was going to… / but… / so… 세 가지 뼈대로 내 어제 이야기 만들기.","여러분이 오늘 직접 답했던 문장 하나만 기억해보세요. 그 한 문장을 자기 상황으로 다시 바꿔 말하면 공부가 조금씩 대화가 됩니다.","한 번 더 직접 말해보세요. 처음보다 조금이라도 더 쉽게 나왔다면 오늘 연습에 의미가 있습니다.","틀려도 돼요. 멈추지만 마세요. 오늘도 함께해 주셔서 감사합니다."],"B":["여러분, 이런 상황에서 영어가 갑자기 멈춘 적 있으세요?","오늘의 장면은 친구에게 어제 있었던 일을 이야기하는 상황입니다.","제가 먼저 질문 하나를 드릴게요. 어제 산책하려고 했는데 비가 와서 집에 있었어요.","(3초) 여러분이라면 어떻게 대답하시겠어요? 바로 말이 안 나와도 괜찮습니다. 여기서 시작할 거예요.","오늘은 I was going to …, but …, so … 하나를 중심으로 연습하겠습니다. 아주 많은 문법을 한꺼번에 외우지 않고, 이미 아는 표현을 조금씩 바꿔 써볼 겁니다.","영상이 끝날 때는 하고 싶었던 일과 생긴 일, 결국 한 일을 세 조각으로 엮어 말하기. 눈으로 보지만 마시고 실제로 입을 열어보세요.","처음 질문은 마지막에 다시 가져옵니다. 그때는 제가 답을 먼저 알려주지 않을 테니 얼마나 달라졌는지 직접 확인해보세요.","틀려도 괜찮습니다. 말을 시작하고 한 번 더 시도하는 데 집중해보세요.","먼저 뜻과 말의 순서를 충분히 이해해보고, 그다음 입으로 연결해보겠습니다.","1번째 연습입니다. 하려고 했어요 — I was going to.","원어민 질문을 듣는다고 생각해보세요. \"What were you going to do?\" (3초)","지나간 계획을 말할 때 I was going to를 먼저 꺼내보세요.","오늘의 핵심 표현은 \"I was going to …, but …, so …\"입니다. 먼저 천천히 한 번, 이번에는 자연스럽게 한 번 더 말해봅니다. (×3)","지금부터 한국어를 보고 먼저 3초 동안 영어로 말해보세요. 바로 정답을 읽지 마시고, 대답한 다음 제가 보여드리는 문장을 따라 말하는 순서입니다.","1번. \"산책하려고 했어요\" (3초)\nI was going to take a walk.\n이 문장, 이번에는 천천히 함께 말해볼까요? I was going to take a walk. (×3)\n잘하셨어요. 앞의 핵심을 그대로 두고 필요한 정보만 바꿔 넣었습니다.","2번. \"친구를 만나려고 했어요\" (3초)\nI was going to meet a friend.\n이 문장, 이번에는 천천히 함께 말해볼까요? I was going to meet a friend. (×3)","3번. \"딸을 보러 가려고 했어요\" (3초)\nI was going to visit my daughter.\n이 문장, 이번에는 천천히 함께 말해볼까요? I was going to visit my daughter. (×3)","4번. \"코트를 사려고 했어요\" (3초)\nI was going to buy a coat.\n이 문장, 이번에는 천천히 함께 말해볼까요? I was going to buy a coat. (×3)","5번. \"운동하려고 했어요\" (3초)\nI was going to work out.\n이 문장, 이번에는 천천히 함께 말해볼까요? I was going to work out. (×3)\n마지막 문장까지 잘하셨습니다. 이제 힌트를 잠깐 내려놓고 다시 말해보세요.","자, 여기까지는 제가 정답을 보여드렸습니다. 이제 바로 답을 보여주지 않겠습니다. 처음 질문으로 돌아갈게요. What were you going to do? (5초)","처음에 막히더라도 전부 처음부터 번역하려고 하지 마세요. 지금 배운 말 중에 가장 쉬운 것 하나부터 꺼내보세요.","발음도 한 가지만 살펴보겠습니다. 문장을 읽을 때 모든 단어를 따로 끊으려고 하면 대화에서 다른 소리로 들릴 수 있어요. 방금 본 'I was going to take a walk.'을 천천히, 그다음 자연스럽게 이어서 두 번 말해보세요.","같은 질문에 짧게 대답하는 것도 좋습니다. 길게 정확히 말하느라 멈추기보다 먼저 의미를 전달하고, 필요하다면 정보를 한 가지 더해 보세요.","2번째 연습입니다. 그런데 — but.","원어민 질문을 듣는다고 생각해보세요. \"What happened?\" (3초)","그런데 무슨 일이 생겼나요? but 뒤에 한 장면을 붙입니다.","오늘의 핵심 표현은 \"I was going to …, but …, so …\"입니다. 먼저 천천히 한 번, 이번에는 자연스럽게 한 번 더 말해봅니다. (×3)","지금부터 한국어를 보고 먼저 3초 동안 영어로 말해보세요. 바로 정답을 읽지 마시고, 대답한 다음 제가 보여드리는 문장을 따라 말하는 순서입니다.","1번. \"그런데 비가 오기 시작했어요\" (3초)\nbut it started raining.\n이 문장, 이번에는 천천히 함께 말해볼까요? but it started raining. (×3)\n잘하셨어요. 앞의 핵심을 그대로 두고 필요한 정보만 바꿔 넣었습니다.","2번. \"그런데 너무 피곤했어요\" (3초)\nbut I was too tired.\n이 문장, 이번에는 천천히 함께 말해볼까요? but I was too tired. (×3)","3번. \"그런데 갑자기 일이 생겼어요\" (3초)\nbut something came up.\n이 문장, 이번에는 천천히 함께 말해볼까요? but something came up. (×3)","4번. \"그런데 너무 비쌌어요\" (3초)\nbut it was too expensive.\n이 문장, 이번에는 천천히 함께 말해볼까요? but it was too expensive. (×3)","5번. \"그런데 시간이 없었어요\" (3초)\nbut I didn't have time.\n이 문장, 이번에는 천천히 함께 말해볼까요? but I didn't have time. (×3)\n마지막 문장까지 잘하셨습니다. 이제 힌트를 잠깐 내려놓고 다시 말해보세요.","자, 여기까지는 제가 정답을 보여드렸습니다. 이제 바로 답을 보여주지 않겠습니다. 처음 질문으로 돌아갈게요. What happened? (5초)","처음에 막히더라도 전부 처음부터 번역하려고 하지 마세요. 지금 배운 말 중에 가장 쉬운 것 하나부터 꺼내보세요.","발음도 한 가지만 살펴보겠습니다. 문장을 읽을 때 모든 단어를 따로 끊으려고 하면 대화에서 다른 소리로 들릴 수 있어요. 방금 본 'but it started raining.'을 천천히, 그다음 자연스럽게 이어서 두 번 말해보세요.","같은 질문에 짧게 대답하는 것도 좋습니다. 길게 정확히 말하느라 멈추기보다 먼저 의미를 전달하고, 필요하다면 정보를 한 가지 더해 보세요.","3번째 연습입니다. 그래서 — so.","원어민 질문을 듣는다고 생각해보세요. \"So what did you do?\" (3초)","결국 한 일을 so 뒤에 붙이면 이야기 한 편이 만들어집니다.","오늘의 핵심 표현은 \"I was going to …, but …, so …\"입니다. 먼저 천천히 한 번, 이번에는 자연스럽게 한 번 더 말해봅니다. (×3)","지금부터 한국어를 보고 먼저 3초 동안 영어로 말해보세요. 바로 정답을 읽지 마시고, 대답한 다음 제가 보여드리는 문장을 따라 말하는 순서입니다.","1번. \"그래서 집에 있었어요\" (3초)\nso I stayed home.\n이 문장, 이번에는 천천히 함께 말해볼까요? so I stayed home. (×3)\n잘하셨어요. 앞의 핵심을 그대로 두고 필요한 정보만 바꿔 넣었습니다.","2번. \"그래서 일찍 잤어요\" (3초)\nso I went to bed early.\n이 문장, 이번에는 천천히 함께 말해볼까요? so I went to bed early. (×3)","3번. \"그래서 대신 전화했어요\" (3초)\nso I called her instead.\n이 문장, 이번에는 천천히 함께 말해볼까요? so I called her instead. (×3)","4번. \"그래서 셔츠를 샀어요\" (3초)\nso I bought a shirt instead.\n이 문장, 이번에는 천천히 함께 말해볼까요? so I bought a shirt instead. (×3)","5번. \"그래서 다음 날로 미뤘어요\" (3초)\nso I put it off until the next day.\n이 문장, 이번에는 천천히 함께 말해볼까요? so I put it off until the next day. (×3)\n마지막 문장까지 잘하셨습니다. 이제 힌트를 잠깐 내려놓고 다시 말해보세요.","자, 여기까지는 제가 정답을 보여드렸습니다. 이제 바로 답을 보여주지 않겠습니다. 처음 질문으로 돌아갈게요. So what did you do? (5초)","처음에 막히더라도 전부 처음부터 번역하려고 하지 마세요. 지금 배운 말 중에 가장 쉬운 것 하나부터 꺼내보세요.","발음도 한 가지만 살펴보겠습니다. 문장을 읽을 때 모든 단어를 따로 끊으려고 하면 대화에서 다른 소리로 들릴 수 있어요. 방금 본 'so I stayed home.'을 천천히, 그다음 자연스럽게 이어서 두 번 말해보세요.","같은 질문에 짧게 대답하는 것도 좋습니다. 길게 정확히 말하느라 멈추기보다 먼저 의미를 전달하고, 필요하다면 정보를 한 가지 더해 보세요.","이제는 세 가지 연습을 섞어보겠습니다. 앞에서는 어떤 연습인지 알고 답했지만, 실제 대화에서는 질문이 섞여서 나옵니다.","첫 번째 질문입니다. What did you do yesterday? (5초)\n제가 먼저 대답하지 않을 테니 본인이 만들 수 있는 가장 짧은 영어로 말해보세요.","두 번째 질문. I was going to take a walk, but it started raining, so I stayed home. (5초)\n아까 연습했던 표현을 그대로 다시 꺼내면 됩니다.","세 번째 질문. So what did you do? (5초)\n이번에는 문장을 조금 더 자연스럽게 이어보세요.","문장을 매번 새로 만드는 게 아니라 익숙한 말에 필요한 정보만 더하는 겁니다. 같은 틀로 다른 장면에 적응하는 연습이죠.","한 번 더 해볼게요. 이번에는 제가 질문을 빠르게 하는 상황이라고 생각해보세요. 안 들렸다면 'Sorry?' 또는 'Could you say that again?'이라고 말하고, 다시 들은 뒤 짧게 대답하는 겁니다.","마지막으로 여러분 상황에 맞는 답을 만듭니다. 지금 떠오르는 자기 이야기 하나를 한국어로 먼저 말하고, 오늘 표현으로 바꿔보세요. (10초)","자, 처음 질문을 다시 가져오겠습니다. 어제 산책하려고 했는데 비가 와서 집에 있었어요.","(5초) 지금은 처음보다 어떤 말부터 해야 하는지 조금 더 보이시나요?","오늘 배운 건 모든 영어를 한꺼번에 외우는 방법이 아닙니다. I was going to… / but… / so… 세 가지 뼈대로 내 어제 이야기 만들기.","여러분이 오늘 직접 답했던 문장 하나만 기억해보세요. 그 한 문장을 자기 상황으로 다시 바꿔 말하면 공부가 조금씩 대화가 됩니다.","처음에는 질문 앞에서 멈췄지만, 지금은 짧게 대답하고 필요하면 다시 물을 수도 있습니다. 오늘 영상에서 가져갈 성과는 바로 그 차이입니다.","틀려도 돼요. 멈추지만 마세요. 오늘도 함께해 주셔서 감사합니다."]},"H0":{"A":["여러분, 이런 상황에서 영어가 갑자기 멈춘 적 있으세요?","오늘의 장면은 도착한 호텔의 프런트 데스크에서 체크인하고 요청하기입니다.","제가 먼저 질문 하나를 드릴게요. May I have your name, please?","(3초) 여러분이라면 어떻게 대답하시겠어요? 바로 말이 안 나와도 괜찮습니다. 여기서 시작할 거예요.","오늘은 Can I …? / I'd like to … 하나를 중심으로 연습하겠습니다. 아주 많은 문법을 한꺼번에 외우지 않고, 이미 아는 표현을 조금씩 바꿔 써볼 겁니다.","영상이 끝날 때는 직원의 질문을 듣고 필요한 정보를 주거나 한 번 더 요청하기. 눈으로 보지만 마시고 실제로 입을 열어보세요.","먼저 하나씩 이해한 다음 직접 따라 말해보겠습니다.","틀려도 괜찮습니다. 말을 시작하고 한 번 더 시도하는 데 집중해보세요.","먼저 뜻과 말의 순서를 충분히 이해해보고, 그다음 입으로 연결해보겠습니다.","1번째 연습입니다. 체크인에서 한마디.","원어민 질문을 듣는다고 생각해보세요. \"May I have your name, please?\" (3초)","이름을 물으면 길게 말하지 않아도 됩니다. 본인 정보를 차분히 이야기하세요.","오늘의 핵심 표현은 \"Can I …? / I'd like to …\"입니다. 먼저 천천히 한 번, 이번에는 자연스럽게 한 번 더 말해봅니다. (×2)","지금부터 한국어를 보고 먼저 3초 동안 영어로 말해보세요. 바로 정답을 읽지 마시고, 대답한 다음 제가 보여드리는 문장을 따라 말하는 순서입니다.","1번. \"예약했어요\" (3초)\nI have a reservation.\n이 문장, 이번에는 천천히 함께 말해볼까요? I have a reservation. (×2)\n잘하셨어요. 앞의 핵심을 그대로 두고 필요한 정보만 바꿔 넣었습니다.","2번. \"제 이름은 민수예요\" (3초)\nMy name is Minsu.\n이 문장, 이번에는 천천히 함께 말해볼까요? My name is Minsu. (×2)","3번. \"김 이름으로 예약했어요\" (3초)\nIt's under Kim.\n이 문장, 이번에는 천천히 함께 말해볼까요? It's under Kim. (×2)","4번. \"체크인하려고요\" (3초)\nI'd like to check in.\n이 문장, 이번에는 천천히 함께 말해볼까요? I'd like to check in. (×2)","5번. \"여권 여기 있어요\" (3초)\nHere's my passport.\n이 문장, 이번에는 천천히 함께 말해볼까요? Here's my passport. (×2)\n마지막 문장까지 잘하셨습니다. 이제 힌트를 잠깐 내려놓고 다시 말해보세요.","자, 여기까지는 제가 정답을 보여드렸습니다. 이제 바로 답을 보여주지 않겠습니다. 처음 질문으로 돌아갈게요. May I have your name, please? (5초)","처음에 막히더라도 전부 처음부터 번역하려고 하지 마세요. 지금 배운 말 중에 가장 쉬운 것 하나부터 꺼내보세요.","2번째 연습입니다. 직원의 질문을 듣고 답하기.","원어민 질문을 듣는다고 생각해보세요. \"How many nights are you staying?\" (3초)","How many nights를 들으면 몇 박인지 대답하세요.","오늘의 핵심 표현은 \"Can I …? / I'd like to …\"입니다. 먼저 천천히 한 번, 이번에는 자연스럽게 한 번 더 말해봅니다. (×2)","지금부터 한국어를 보고 먼저 3초 동안 영어로 말해보세요. 바로 정답을 읽지 마시고, 대답한 다음 제가 보여드리는 문장을 따라 말하는 순서입니다.","1번. \"3박이에요\" (3초)\nFor three nights.\n이 문장, 이번에는 천천히 함께 말해볼까요? For three nights. (×2)\n잘하셨어요. 앞의 핵심을 그대로 두고 필요한 정보만 바꿔 넣었습니다.","2번. \"혼자 왔어요\" (3초)\nI'm traveling alone.\n이 문장, 이번에는 천천히 함께 말해볼까요? I'm traveling alone. (×2)","3번. \"딸과 함께 왔어요\" (3초)\nI'm here with my daughter.\n이 문장, 이번에는 천천히 함께 말해볼까요? I'm here with my daughter. (×2)","4번. \"예약번호가 여기 ave a reservation.'을 천천히, 그다음 자연스럽게 이어서 두 번 말해보세요.","같은 질문에 짧게 대답하는 것도 좋습니다. 길게 정확히 말하느라 멈추기보다 먼저 의미를 전달하고, 필요하다면 정보를 한 가지 더해 보세요.","2번째 연습입니다. 직원의 질문을 듣고 답하기.","원어민 질문을 듣는다고 생각해보세요. \"How many nights are you staying?\" (3초)","How many nights를 들으면 몇 박인지 대답하세요.","오늘의 핵심 표현은 \"Can I …? / I'd like to …\"입니다. 먼저 천천히 한 번, 이번에는 자연스럽게 한 번 더 말해봅니다. (×3)","지금부터 한국어를 보고 먼저 3초 동안 영어로 말해보세요. 바로 정답을 읽지 마시고, 대답한 다음 제가 보여드리는 문장을 따라 말하는 순서입니다.","1번. \"3박이에요\" (3초)\nFor three nights.\n이 문장, 이번에는 천천히 함께 말해볼까요? For three nights. (×3)\n잘하셨어요. 앞의 핵심을 그대로 두고 필요한 정보만 바꿔 넣었습니다.","2번. \"혼자 왔어요\" (3초)\nI'm traveling alone.\n이 문장, 이번에는 천천히 함께 말해볼까요? I'm traveling alone. (×3)","3번. \"딸과 함께 왔어요\" (3초)\nI'm here with my daughter.\n이 문장, 이번에는 천천히 함께 말해볼까요? I'm here with my daughter. (×3)","4번. \"예약번호가 여기 있어요\" (3초)\nHere's my confirmation number.\n이 문장, 이번에는 천천히 함께 말해볼까요? Here's my confirmation number. (×3)","5번. \"이름을 다시 알려드릴게요\" (3초)\nLet me spell my name.\n이 문장, 이번에는 천천히 함께 말해볼까요? Let me spell my name. (×3)\n마지막 문장까지 잘하셨습니다. 이제 힌트를 잠깐 내려놓고 다시 말해보세요.","자, 여기까지는 제가 정답을 보여드렸습니다. 이제 바로 답을 보여주지 않겠습니다. 처음 질문으로 돌아갈게요. How many nights are you staying? (5초)","처음에 막히더라도 전부 처음부터 번역하려고 하지 마세요. 지금 배운 말 중에 가장 쉬운 것 하나부터 꺼내보세요.","발음도 한 가지만 살펴보겠습니다. 문장을 읽을 때 모든 단어를 따로 끊으려고 하면 대화에서 다른 소리로 들릴 수 있어요. 방금 본 'For three nights.'을 천천히, 그다음 자연스럽게 이어서 두 번 말해보세요.","같은 질문에 짧게 대답하는 것도 좋습니다. 길게 정확히 말하느라 멈추기보다 먼저 의미를 전달하고, 필요하다면 정보를 한 가지 더해 보세요.","3번째 연습입니다. 필요한 것을 요청하기.","원어민 질문을 듣는다고 생각해보세요. \"How can I help you?\" (3초)","호텔에서는 Can I get…? 또는 Could I…?로 정중하게 요청할 수 있습니다.","오늘의 핵심 표현은 \"Can I …? / I'd like to …\"입니다. 먼저 천천히 한 번, 이번에는 자연스럽게 한 번 더 말해봅니다. (×3)","지금부터 한국어를 보고 먼저 3초 동안 영어로 말해보세요. 바로 정답을 읽지 마시고, 대답한 다음 제가 보여드리는 문장을 따라 말하는 순서입니다.","1번. \"조식이 포함돼 있나요?\" (3초)\nIs breakfast included?\n이 문장, 이번에는 천천히 함께 말해볼까요? Is breakfast included? (×3)\n잘하셨어요. 앞의 핵심을 그대로 두고 필요한 정보만 바꿔 넣었습니다.","2번. \"수건을 더 받을 수 있을까요?\" (3초)\nCould I have some extra towels?\n이 문장, 이번에는 천천히 함께 말해볼까요? Could I have some extra towels? (×3)","3번. \"와이파이 비밀번호가 뭐예요?\" (3초)\nWhat's the Wi-Fi password?\n이 문장, 이번에는 천천히 함께 말해볼까요? What's the Wi-Fi password? (×3)","4번. \"체크아웃 시간이 언제인가요?\" (3초)\nWhat time is check-out?\n이 문장, 이번에는 천천히 함께 말해볼까요? What time is check-out? (×3)","5번. \"다시 말씀해 주시겠어요?\" (3초)\nCould you say that again?\n이 문장, 이번에는 천천히 함께 말해볼까요? Could you say that again? (×3)\n마지막 문장까지 잘하셨습니다. 이제 힌트를 잠깐 내려놓고 다시 말해보세요.","자, 여기까지는 제가 정답을 보여드렸습니다. 이제 바로 답을 보여주지 않겠습니다. 처음 질문으로 돌아갈게요. How can I help you? (5초)","처음에 막히더라도 전부 처음부터 번역하려고 하지 마세요. 지금 배운 말 중에 가장 쉬운 것 하나부터 꺼내보세요.","발음도 한 가지만 살펴보겠습니다. 문장을 읽을 때 모든 단어를 따로 끊으려고 하면 대화에서 다른 소리로 들릴 수 있어요. 방금 본 'Is breakfast included?'을 천천히, 그다음 자연스럽게 이어서 두 번 말해보세요.","같은 질문에 짧게 대답하는 것도 좋습니다. 길게 정확히 말하느라 멈추기보다 먼저 의미를 전달하고, 필요하다면 정보를 한 가지 더해 보세요.","이제는 세 가지 연습을 섞어보겠습니다. 앞에서는 어떤 연습인지 알고 답했지만, 실제 대화에서는 질문이 섞여서 나옵니다.","첫 번째 질문입니다. Good evening. May I have your name? (5초)\n제가 먼저 대답하지 않을 테니 본인이 만들 수 있는 가장 짧은 영어로 말해보세요.","두 번째 질문. How many nights are you staying? (5초)\n아까 연습했던 표현을 그대로 다시 꺼내면 됩니다.","세 번째 질문. Is breakfast included? (5초)\n이번에는 문장을 조금 더 자연스럽게 이어보세요.","문장을 매번 새로 만드는 게 아니라 익숙한 말에 필요한 정보만 더하는 겁니다. 같은 틀로 다른 장면에 적응하는 연습이죠.","한 번 더 해볼게요. 이번에는 제가 질문을 빠르게 하는 상황이라고 생각해보세요. 안 들렸다면 'Sorry?' 또는 'Could you say that again?'이라고 말하고, 다시 들은 뒤 짧게 대답하는 겁니다.","마지막으로 여러분 상황에 맞는 답을 만듭니다. 지금 떠오르는 자기 이야기 하나를 한국어로 먼저 말하고, 오늘 표현으로 바꿔보세요. (10초)","자, 처음 질문을 다시 가져오겠습니다. May I have your name, please?","(5초) 지금은 처음보다 어떤 말부터 해야 하는지 조금 더 보이시나요?","오늘 배운 건 모든 영어를 한꺼번에 외우는 방법이 아닙니다. 예약 확인부터 조식 문의까지 하나의 호텔 장면으로 연결.","여러분이 오늘 직접 답했던 문장 하나만 기억해보세요. 그 한 문장을 자기 상황으로 다시 바꿔 말하면 공부가 조금씩 대화가 됩니다.","처음에는 질문 앞에서 멈췄지만, 지금은 짧게 대답하고 필요하면 다시 물을 수도 있습니다. 오늘 영상에서 가져갈 성과는 바로 그 차이입니다.","틀려도 돼요. 멈추지만 마세요. 오늘도 함께해 주셔서 감사합니다."]},"H1":{"A":["여러분, 이런 상황에서 영어가 갑자기 멈춘 적 있으세요?","오늘의 장면은 카페에서 친구에게 어제 했던 일을 소개하는 상황입니다.","제가 먼저 질문 하나를 드릴게요. 나는 어제 카페에서 친구를 만났어요.","(3초) 여러분이라면 어떻게 대답하시겠어요? 바로 말이 안 나와도 괜찮습니다. 여기서 시작할 거예요.","오늘은 I + 동사 + 필요한 정보 하나를 중심으로 연습하겠습니다. 아주 많은 문법을 한꺼번에 외우지 않고, 이미 아는 표현을 조금씩 바꿔 써볼 겁니다.","영상이 끝날 때는 긴 문장 전체를 외우지 않고 기본 문장부터 시작해 정보 세 개 붙이기. 눈으로 보지만 마시고 실제로 입을 열어보세요.","먼저 하나씩 이해한 다음 직접 따라 말해보겠습니다.","틀려도 괜찮습니다. 말을 시작하고 한 번 더 시도하는 데 집중해보세요.","먼저 뜻과 말의 순서를 충분히 이해해보고, 그다음 입으로 연결해보겠습니다.","1번째 연습입니다. 누가 무엇을 했을까요?.","원어민 질문을 듣는다고 생각해보세요. \"What did you do?\" (3초)","문장이 복잡해져도 먼저 누가 무엇을 했는지 찾아봅니다.","오늘의 핵심 표현은 \"I + 동사 + 필요한 정보\"입니다. 먼저 천천히 한 번, 이번에는 자연스럽게 한 번 더 말해봅니다. (×2)","지금부터 한국어를 보고 먼저 3초 동안 영어로 말해보세요. 바로 정답을 읽지 마시고, 대답한 다음 제가 보여드리는 문장을 따라 말하는 순서입니다.","1번. \"나는 영어를 공부했어요\" (3초)\nI studied English.\n이 문장, 이번에는 천천히 함께 말해볼까요? I studied English. (×2)\n잘하셨어요. 앞의 핵심을 그대로 두고 필요한 정보만 바꿔 넣었습니다.","2번. \"나는 친구를 만났어요\" (3초)\nI met my friend.\n이 문장, 이번에는 천천히 함께 말해볼까요? I met my friend. (×2)","3번. \"나는 선물을 샀어요\" (3초)\nI bought a gift.\n이 문장, 이번에는 천천히 함께 말해볼까요? I bought a gift. (×2)","4번. \"나는 커피를 마셨어요\" (3초)\nI drank coffee.\n이 문장, 이번에는 천천히 함께 말해볼까요? I drank coffee. (×2)","5번. \"나는 공원에서 걸었어요\" (3초)\nI walked in the park.\n이 문장, 이번에는 천천히 함께 말해볼까요? I walked in the park. (×2)\n마지막 문장까지 잘하셨습니다. 이제 힌트를 잠깐 내려놓고 다시 말해보세요.","자, 여기까지는 제가 정답을 보여드렸습니다. 이제 바로 답을 보여주지 않겠습니다. 처음 질문으로 돌아갈게요. What did you do? (5초)","처음에 막히더라도 전부 처음부터 번역하려고 하지 마세요. 지금 배운 말 중에 가장 쉬운 것 하나부터 꺼내보세요.","2번째 연습입니다. 필요한 사람과 장소 붙이기.","원어민 질문을 듣는다고 생각해보세요. \"With whom? Where?\" (3초)","핵심 문장 뒤에 누구와 어디에서를 붙여 조금 더 구체적으로 설명합니다.","오늘의 핵심 표현은 \"I + 동사 + 필요한 정보\"입니다. 먼저 천천히 한 번, 이번에는 자연스럽게 한 번 더 말해봅니다. (×2)","지금부터 한국어를 보고 먼저 3초 동안 영어로 말해보세요. 바로 정답을 읽지 마시고, 대답한 다음 제가 보여드리는 문장을 따라 말하는 순서입니다.","1번. \"친구와 영어를 공부했어요\" (3초)\nI studied English with my friend.\n이 문장, 이번에는 천천히 함께 말해볼까요? I studied English with my friend. (×2)\n잘하셨어요. 앞의 핵심을 그대로 두고 필요한 정보만 바꿔 넣었습니다.","2번. \"카페에서 친구를 만났어요\" (3초)\nI met my friend at a cafe.\n이 문장, 이번에는 천천히 함께 말해볼까요? I met my friend at a cafe. (×2)","3번. \"딸을 위해 선물을 샀어요\" (3초)\nI bought a gift for my daughter.\n이 문장, 이번에는 천천히 함께 말해볼까요? I bought a gift for my daughter. (×2)","4번. \"집에서 커피를 마셨어요\" (3초)\nI drank coffee at home.\n이 문장, 이번에는 천천히 함께 말해볼까요? I drank coffee at home. (×2)","5번. \"동네 공원에서 걸었어요\" (3초)\nI walked in a park near my home.\n이 야 하는지 조금 더 보이시나요?","오늘 배운 건 모든 영어를 한꺼번에 외우는 방법이 아닙니다. 누가 무엇을 했는가부터 말한 다음 정보를 한 조각씩 붙이기.","여러분이 오늘 직접 답했던 문장 하나만 기억해보세요. 그 한 문장을 자기 상황으로 다시 바꿔 말하면 공부가 조금씩 대화가 됩니다.","한 번 더 직접 말해보세요. 처음보다 조금이라도 더 쉽게 나왔다면 오늘 연습에 의미가 있습니다.","틀려도 돼요. 멈추지만 마세요. 오늘도 함께해 주셔서 감사합니다."],"B":["여러분, 이런 상황에서 영어가 갑자기 멈춘 적 있으세요?","오늘의 장면은 카페에서 친구에게 어제 했던 일을 소개하는 상황입니다.","제가 먼저 질문 하나를 드릴게요. 나는 어제 카페에서 친구를 만났어요.","(3초) 여러분이라면 어떻게 대답하시겠어요? 바로 말이 안 나와도 괜찮습니다. 여기서 시작할 거예요.","오늘은 I + 동사 + 필요한 정보 하나를 중심으로 연습하겠습니다. 아주 많은 문법을 한꺼번에 외우지 않고, 이미 아는 표현을 조금씩 바꿔 써볼 겁니다.","영상이 끝날 때는 긴 문장 전체를 외우지 않고 기본 문장부터 시작해 정보 세 개 붙이기. 눈으로 보지만 마시고 실제로 입을 열어보세요.","처음 질문은 마지막에 다시 가져옵니다. 그때는 제가 답을 먼저 알려주지 않을 테니 얼마나 달라졌는지 직접 확인해보세요.","틀려도 괜찮습니다. 말을 시작하고 한 번 더 시도하는 데 집중해보세요.","먼저 뜻과 말의 순서를 충분히 이해해보고, 그다음 입으로 연결해보겠습니다.","1번째 연습입니다. 누가 무엇을 했을까요?.","원어민 질문을 듣는다고 생각해보세요. \"What did you do?\" (3초)","문장이 복잡해져도 먼저 누가 무엇을 했는지 찾아봅니다.","오늘의 핵심 표현은 \"I + 동사 + 필요한 정보\"입니다. 먼저 천천히 한 번, 이번에는 자연스럽게 한 번 더 말해봅니다. (×3)","지금부터 한국어를 보고 먼저 3초 동안 영어로 말해보세요. 바로 정답을 읽지 마시고, 대답한 다음 제가 보여드리는 문장을 따라 말하는 순서입니다.","1번. \"나는 영어를 공부했어요\" (3초)\nI studied English.\n이 문장, 이번에는 천천히 함께 말해볼까요? I studied English. (×3)\n잘하셨어요. 앞의 핵심을 그대로 두고 필요한 정보만 바꿔 넣었습니다.","2번. \"나는 친구를 만났어요\" (3초)\nI met my friend.\n이 문장, 이번에는 천천히 함께 말해볼까요? I met my friend. (×3)","3번. \"나는 선물을 샀어요\" (3초)\nI bought a gift.\n이 문장, 이번에는 천천히 함께 말해볼까요? I bought a gift. (×3)","4번. \"나는 커피를 마셨어요\" (3초)\nI drank coffee.\n이 문장, 이번에는 천천히 함께 말해볼까요? I drank coffee. (×3)","5번. \"나는 공원에서 걸었어요\" (3초)\nI walked in the park.\n이 문장, 이번에는 천천히 함께 말해볼까요? I walked in the park. (×3)\n마지막 문장까지 잘하셨습니다. 이제 힌트를 잠깐 내려놓고 다시 말해보세요.","자, 여기까지는 제가 정답을 보여드렸습니다. 이제 바로 답을 보여주지 않겠습니다. 처음 질문으로 돌아갈게요. What did you do? (5초)","처음에 막히더라도 전부 처음부터 번역하려고 하지 마세요. 지금 배운 말 중에 가장 쉬운 것 하나부터 꺼내보세요.","발음도 한 가지만 살펴보겠습니다. 문장을 읽을 때 모든 단어를 따로 끊으려고 하면 대화에서 다른 소리로 들릴 수 있어요. 방금 본 'I studied English.'을 천천히, 그다음 자연스럽게 이어서 두 번 말해보세요.","같은 질문에 짧게 대답하는 것도 좋습니다. 길게 정확히 말하느라 멈추기보다 먼저 의미를 전달하고, 필요하다면 정보를 한 가지 더해 보세요.","2번째 연습입니다. 필요한 사람과 장소 붙이기.","원어민 질문을 듣는다고 생각해보세요. \"With whom? Where?\" (3초)","핵심 문장 뒤에 누구와 어디에서를 붙여 조금 더 구체적으로 설명합니다.","오늘의 핵심 표현은 \"I + 동사 + 필요한 정보\"입니다. 먼저 천천히 한 번, 이번에는 자연스럽게 한 번 더 말해봅니다. (×3)","지금부터 한국어를 보고 먼저 3초 동안 영어로 말해보세요. 바로 정답을 읽지 마시고, 대답한 다음 제가 보여드리는 문장을 따라 말하는 순서입니다.","1번. \"친구와 영어를 공부했어요\" (3초)\nI studied English with my friend.\n이 문장, 이번에는 천천히 함께 말해볼까요? I studied English with my friend. (×3)\n잘하셨어요. 앞의 핵심을 그대로 두고 필요한 정보만 바꿔 넣었습니다.","2번. \"카페에서 친구를 만났어요\" (3초)\nI met my friend at a cafe.\n이 문장, 이번에는 천천히 함께 말해볼까요? I met my friend at a cafe. (×3)","3번. \"딸을 위해 선물을 샀어요\" (3초)\nI bought a gift for my daughter.\n이 문장, 이번에는 천천히 함께 말해볼까요? I bought a gift for my daughter. (×3)","4번. \"집에서 커피를 마셨어요\" (3초)\nI drank coffee at home.\n이 문장, 이번에는 천천히 함께 말해볼까요? I drank coffee at home. (×3)","5번. \"동네 공원에서 걸었어요\" (3초)\nI walked in a park near my home.\n이 문장, 이번에는 천천히 함께 말해볼까요? I walked in a park near my home. (×3)\n마지막 문장까지 잘하셨습니다. 이제 힌트를 잠깐 내려놓고 다시 말해보세요.","자, 여기까지는 제가 정답을 보여드렸습니다. 이제 바로 답을 보여주지 않겠습니다. 처음 질문으로 돌아갈게요. With whom? Where? (5초)","처음에 막히더라도 전부 처음부터 번역하려고 하지 마세요. 지금 배운 말 중에 가장 쉬운 것 하나부터 꺼내보세요.","발음도 한 가지만 살펴보겠습니다. 문장을 읽을 때 모든 단어를 따로 끊으려고 하면 대화에서 다른 소리로 들릴 수 있어요. 방금 본 'I studied English with my friend.'을 천천히, 그다음 자연스럽게 이어서 두 번 말해보세요.","같은 질문에 짧게 대답하는 것도 좋습니다. 길게 정확히 말하느라 멈추기보다 먼저 의미를 전달하고, 필요하다면 정보를 한 가지 더해 보세요.","3번째 연습입니다. 시간까지 넣어서 연결하기.","원어민 질문을 듣는다고 생각해보세요. \"When?\" (3초)","시간을 마지막에 더하는 쉬운 출발점부터 연습합니다.","오늘의 핵심 표현은 \"I + 동사 + 필요한 정보\"입니다. 먼저 천천히 한 번, 이번에는 자연스럽게 한 번 더 말해봅니다. (×3)","지금부터 한국어를 보고 먼저 3초 동안 영어로 말해보세요. 바로 정답을 읽지 마시고, 대답한 다음 제가 보여드리는 문장을 따라 말하는 순서입니다.","1번. \"어제 친구와 영어를 공부했어요\" (3초)\nI studied English with my friend yesterday.\n이 문장, 이번에는 천천히 함께 말해볼까요? I studied English with my friend yesterday. (×3)\n잘하셨어요. 앞의 핵심을 그대로 두고 필요한 정보만 바꿔 넣었습니다.","2번. \"어제 카페에서 친구를 만났어요\" (3초)\nI met my friend at a cafe yesterday.\n이 문장, 이번에는 천천히 함께 말해볼까요? I met my friend at a cafe yesterday. (×3)","3번. \"어제 딸을 위해 선물을 샀어요\" (3초)\nI bought a gift for my daughter yesterday.\n이 문장, 이번에는 천천히 함께 말해볼까요? I bought a gift for my daughter yesterday. (×3)","4번. \"오늘 아침 집에서 커피를 마셨어요\" (3초)\nI drank coffee at home this morning.\n이 문장, 이번에는 천천히 함께 말해볼까요? I drank coffee at home this morning. (×3)","5번. \"어제 저녁 공원에서 걸었어요\" (3초)\nI walked in the park last night.\n이 문장, 이번에는 천천히 함께 말해볼까요? I walked in the park last night. (×3)\n마지막 문장까지 잘하셨습니다. 이제 힌트를 잠깐 내려놓고 다시 말해보세요.","자, 여기까지는 제가 정답을 보여드렸습니다. 이제 바로 답을 보여주지 않겠습니다. 처음 질문으로 돌아갈게요. When? (5초)","처음에 막히더라도 전부 처음부터 번역하려고 하지 마세요. 지금 배운 말 중에 가장 쉬운 것 하나부터 꺼내보세요.","발음도 한 가지만 살펴보겠습니다. 문장을 읽을 때 모든 단어를 따로 끊으려고 하면 대화에서 다른 소리로 들릴 수 있어요. 방금 본 'I studied English with my friend yesterday.'을 천천히, 그다음 자연스럽게 이어서 두 번 말해보세요.","같은 질문에 짧게 대답하는 것도 좋습니다. 길게 정확히 말하느라 멈추기보다 먼저 의미를 전달하고, 필요하다면 정보를 한 가지 더해 보세요.","이제는 세 가지 연습을 섞어보겠습니다. 앞에서는 어떤 연습인지 알고 답했지만, 실제 대화에서는 질문이 섞여서 나옵니다.","첫 번째 질문입니다. What did you do yesterday? (5초)\n제가 먼저 대답하지 않을 테니 본인이 만들 수 있는 가장 짧은 영어로 말해보세요.","두 번째 질문. Who did you meet? (5초)\n아까 연습했던 표현을 그대로 다시 꺼내면 됩니다.","세 번째 질문. Where did you meet? (5초)\n이번에는 문장을 조금 더 자연스럽게 이어보세요.","문장을 매번 새로 만드는 게 아니라 익숙한 말에 필요한 정보만 더하는 겁니다. 같은 틀로 다른 장면에 적응하는 연습이죠.","한 번 더 해볼게요. 이번에는 제가 질문을 빠르게 하는 상황이라고 생각해보세요. 안 들렸다면 'Sorry?' 또는 'Could you say that again?'이라고 말하고, 다시 들은 뒤 짧게 대답하는 겁니다.","마지막으로 여러분 상황에 맞는 답을 만듭니다. 지금 떠오르는 자기 이야기 하나를 한국어로 먼저 말하고, 오늘 표현으로 바꿔보세요. (10초)","자, 처음 질문을 다시 가져오겠습니다. 나는 어제 카페에서 친구를 만났어요.","(5초) 지금은 처음보다 어떤 말부터 해야 하는지 조금 더 보이시나요?","오늘 배운 건 모든 영어를 한꺼번에 외우는 방법이 아닙니다. 누가 무엇을 했는가부터 말한 다음 정보를 한 조각씩 붙이기.","여러분이 오늘 직접 답했던 문장 하나만 기억해보세요. 그 한 문장을 자기 상황으로 다시 바꿔 말하면 공부가 조금씩 대화가 됩니다.","처음에는 질문 앞에서 멈췄지만, 지금은 짧게 대답하고 필요하면 다시 물을 수도 있습니다. 오늘 영상에서 가져갈 성과는 바로 그 차이입니다.","틀려도 돼요. 멈추지만 마세요. 오늘도 함께해 주셔서 감사합니다."]},"H2":{"A":["여러분, 이런 상황에서 영어가 갑자기 멈춘 적 있으세요?","오늘의 장면은 친구가 What do you want to do?라고 빠르게 물어보는 상황입니다.","제가 먼저 질문 하나를 드릴게요. What do you want to do?","(3초) 여러분이라면 어떻게 대답하시겠어요? 바로 말이 안 나와도 괜찮습니다. 여기서 시작할 거예요.","오늘은 듣기 → 뜻 확인 → 다시 듣기 하나를 중심으로 연습하겠습니다. 아주 많은 문법을 한꺼번에 외우지 않고, 이미 아는 표현을 조금씩 바꿔 써볼 겁니다.","영상이 끝날 때는 아는 단어가 소리에서 왜 안 들리는지 구분하고 다시 듣기. 눈으로 보지만 마시고 실제로 입을 열어보세요.","  want to stay a few more days.\n이 문장, 이번에는 천천히 함께 말해볼까요? I want to stay a few more days. (×3)\n마지막 문장까지 잘하셨습니다. 이제 힌트를 잠깐 내려놓고 다시 말해보세요.","자, 여기까지는 제가 정답을 보여드렸습니다. 이제 바로 답을 보여주지 않겠습니다. 처음 질문으로 돌아갈게요. What do you want to do? (5초)","처음에 막히더라도 전부 처음부터 번역하려고 하지 마세요. 지금 배운 말 중에 가장 쉬운 것 하나부터 꺼내보세요.","발음도 한 가지만 살펴보겠습니다. 문장을 읽을 때 모든 단어를 따로 끊으려고 하면 대화에서 다른 소리로 들릴 수 있어요. 방금 본 'I want to have coffee.'을 천천히, 그다음 자연스럽게 이어서 두 번 말해보세요.","같은 질문에 짧게 대답하는 것도 좋습니다. 길게 정확히 말하느라 멈추기보다 먼저 의미를 전달하고, 필요하다면 정보를 한 가지 더해 보세요.","이제는 세 가지 연습을 섞어보겠습니다. 앞에서는 어떤 연습인지 알고 답했지만, 실제 대화에서는 질문이 섞여서 나옵니다.","첫 번째 질문입니다. What do you want to do? (5초)\n제가 먼저 대답하지 않을 테니 본인이 만들 수 있는 가장 짧은 영어로 말해보세요.","두 번째 질문. Where do you want to go? (5초)\n아까 연습했던 표현을 그대로 다시 꺼내면 됩니다.","세 번째 질문. When do you want to leave? (5초)\n이번에는 문장을 조금 더 자연스럽게 이어보세요.","문장을 매번 새로 만드는 게 아니라 익숙한 말에 필요한 정보만 더하는 겁니다. 같은 틀로 다른 장면에 적응하는 연습이죠.","한 번 더 해볼게요. 이번에는 제가 질문을 빠르게 하는 상황이라고 생각해보세요. 안 들렸다면 'Sorry?' 또는 'Could you say that again?'이라고 말하고, 다시 들은 뒤 짧게 대답하는 겁니다.","마지막으로 여러분 상황에 맞는 답을 만듭니다. 지금 떠오르는 자기 이야기 하나를 한국어로 먼저 말하고, 오늘 표현으로 바꿔보세요. (10초)","자, 처음 질문을 다시 가져오겠습니다. What do you want to do?","(5초) 지금은 처음보다 어떤 말부터 해야 하는지 조금 더 보이시나요?","오늘 배운 건 모든 영어를 한꺼번에 외우는 방법이 아닙니다. 듣기 → 문자 확인 → 다시 듣기로 막히는 위치 확인.","여러분이 오늘 직접 답했던 문장 하나만 기억해보세요. 그 한 문장을 자기 상황으로 다시 바꿔 말하면 공부가 조금씩 대화가 됩니다.","처음에는 질문 앞에서 멈췄지만, 지금은 짧게 대답하고 필요하면 다시 물을 수도 있습니다. 오늘 영상에서 가져갈 성과는 바로 그 차이입니다.","틀려도 돼요. 멈추지만 마세요. 오늘도 함께해 주셔서 감사합니다."]}};

const RESEARCH_META={"A0":{"problem":"영어 질문을 머릿속으로 모두 번역하는 동안 대답할 기회를 놓친다.","gap":"기존 여행 표현 목록과 달리 질문의 첫 단어를 듣고 즉시 답하는 훈련","format":"질문 청취 → 3초 응답 → 다시 묻기 → 재도전","risk":"질문 첫 단어만으로 모든 의도를 판단할 수는 없음. 선택한 상황에서 연습할 기준임"},"A1":{"problem":"I take a walk까지 말한 뒤 Where? When? Why?에서 멈춘다.","gap":"어순 지식을 대화의 짧은 왕복으로 전환하는 후속 훈련","format":"첫 문장 → Where → When → Why → 실제 대화","risk":"한 문장의 확장만으로 즉흥 회화 전체가 해결된다는 주장은 피해야 함"},"A2":{"problem":"일어난 일을 길게 설명하려다 문장 시작 자체가 어려워진다.","gap":"과거 문법 설명이 아닌 일상 이야기 완성 경험","format":"세 마디 발견 → 예문 바꿔끼기 → 즉석 이야기","risk":"모든 과거 경험을 이 세 연결 표현으로 말할 수 있는 것은 아님"},"H0":{"problem":"호텔 직원의 빠른 말에서 객실·기간·조식 질문을 놓친다.","gap":"질문을 듣고 맞는 정보 하나만 말하는 짧은 실습","format":"원어민 질문 → 정보 1개 → 필요하면 재질문","risk":"외부 웹 조사 URL만으로 시장 수요나 효과를 단정할 수 없음"},"H1":{"problem":"문장이 길어지면 장소·시간·이유 정보를 한꺼번에 번역하려 한다.","gap":"짧은 문장으로 시작하고 필요한 정보만 덧붙이는 발화 연습","format":"핵심 문장 → 사람 → 장소 → 시간 → 실전","risk":"영어의 모든 어순이 한 가지 공식으로 고정되는 것은 아님"},"H2":{"problem":"글로는 읽히지만 실제 음성에서는 단어 연결과 의미 처리가 어렵다.","gap":"못 듣는 이유를 단어·소리·의미 처리로 나눠서 실습","format":"처음 듣기 → 실마리 → 재청취 → 짧게 답하기","risk":"오디오 파일이 없는 데모는 청취 훈련 자체를 실행하지 않음"}};
const pack=()=>DEMO_PACKAGES[choice]||DEMO_PACKAGES.A0;
const research=()=>RESEARCH_META[choice]||RESEARCH_META.A0;
function draft(b){
 const s=SCRIPT_SAMPLES[choice]||SCRIPT_SAMPLES['A0'];
 const paragraphs=s[b?'B':'A'].slice();
 // Reflect the selected research direction through an actual spoken practice prompt.
 const directions={
   1:'여기서 한 가지 확인할게요. 영어를 말하다 멈춰도 괜찮습니다. 지금 들은 예문을 처음부터 외우려고 하지 말고, 어디에서 막혔는지 찾아 그 부분만 다시 말해보세요.',
   2:'이제 이 문장을 실제 대화라고 생각해보세요. 상대가 묻는 질문을 듣고 짧게 답한 다음, 알고 있는 정보를 하나만 더 붙여보세요. 다음 질문까지 이어가면 충분합니다.'
 };
 if(direction!==0)paragraphs.splice(Math.max(2,paragraphs.length-1),0,directions[direction]);
 return paragraphs.join('\n').replace(/\*\*/g,'');
}
function link(stepTo,text){return `<button class="back" onclick="go(${stepTo})">← ${text}</button>`}
function evidence(content){return `<div class="bottom"><details><summary>판단 근거 · 데이터 보기</summary><div class="details-copy">${content}</div></details></div>`}
function go(n){step=n;window.scrollTo(0,0);render()}
function setGoal(v){goal=v;render()}
function setChoice(v){if(choice!==v){choice=v;built=false;showB=true;finalScript=''}render()}
function setDirection(v){if(direction!==v){direction=v;built=false;showB=true;finalScript=''}render()}
function createB(){built=true;showB=true;render()}
function viewB(v){showB=v;render()}
function confirmDraft(){finalScript=draft(built&&showB);go(4)}
function download(){let a=document.createElement('a');let u=URL.createObjectURL(new Blob([finalScript],{type:'text/markdown;charset=utf-8'}));a.href=u;a.download='demo_final_script.md';a.click();setTimeout(()=>URL.revokeObjectURL(u),700)}
function render(){let body='';const rec=selected();
if(step===0){body=`<div class="hero"><h1>내 채널에 맞는 다음 주제 찾기</h1></div>
<div class="goal">${['신규 유입','신뢰 형성'].map(x=>`<button class="${goal===x?'selected':''}" onclick="setGoal('${x}')">${x}</button>`).join('')}</div>
<div class="chat"><textarea id="topic" placeholder="어떤 주제를 고민하고 있나요?"></textarea><div class="actions"><button class="primary" onclick="go(1)">주제 찾기 ↑</button></div></div>`}
else if(step===1){const a=all().filter(x=>x.source==='A'),b=all().filter(x=>x.source==='B');const cards=items=>items.map(x=>`<label class="topic ${x.key===choice?'on':''}"><input type="radio" name="candidate" ${x.key===choice?'checked':''} onchange="setChoice('${x.key}')"><span>${safe(x.rank)}순위 · ${safe(x.title)}</span></label>`).join('');body=`<h2>다음 영상, 무엇을 만들까요?</h2><div class="group">A · 내 채널 분석</div>${cards(a)}<div class="group">B · 외부 웹 조사</div>${cards(b)}<p class="hint">${safe(rec.reason).slice(0,170)}</p><div class="actions"><button class="primary" onclick="go(2)">이 주제 심층 조사</button></div>${evidence(`<p><b>선정 이유</b> · ${safe(rec.reason)}</p><p><b>비교</b> · ${safe(rec.tradeoff)}</p><p>검색량·예상 조회수로 검증된 결과는 아닙니다.</p>`)}${link(0,'주제 찾기')}`}
else if(step===2){body=`<h2>영상 방향 선택</h2><div class="pick">${safe(rec.title)}</div><div class="group">이 영상을 만드는 방향</div>${dirItems.map((d,i)=>`<label class="topic ${direction===i?'on':''}"><input type="radio" name="direction" onchange="setDirection(${i})" ${direction===i?'checked':''}><span>${i+1}. ${safe(d[0])}</span></label>`).join('')}<div class="pick">${safe(dirItems[direction][1])}</div><div class="actions"><button class="primary" onclick="go(3)">이 방향으로 대본 만들기</button></div>${evidence(`<p><b>핵심 문제</b> · ${safe(research().problem)}</p><p><b>지식 공백</b> · ${safe(research().gap)}</p><p><b>설명 방향</b> · ${safe(research().format)}</p><p><b>Content DNA</b> · 문제 제기 → 핵심 예문 → 직접 말하기 → 마지막 재도전</p><p><b>자막 조사</b> · 예시 자막 4/4 (가상 수치)</p><p><b>한계</b> · ${safe(research().risk)}</p>`)}${link(1,'주제 비교')}`}
else if(step===3){body=`<h2>대본 확인</h2><div class="draft-title">${safe(pack().titles[0])}<div style="font-size:13px;font-weight:450;color:#a3a5a6;letter-spacing:0;margin-top:8px">썸네일 · ${safe(pack().thumbs[0])}</div></div>`;
if(!built){body+=`<div class="actions"><button class="primary" onclick="createB()">Draft B 만들기</button></div><h3 class="scripthead">Draft A · 예시 원고</h3><div class="manuscript">${safe(draft(false))}</div>`}
else{body+=`<div class="goal"><button class="${!showB?'selected':''}" onclick="viewB(false)">Draft A</button><button class="${showB?'selected':''}" onclick="viewB(true)">Draft B</button></div><div class="manuscript">${safe(draft(showB))}</div><div class="actions"><button class="primary" onclick="confirmDraft()">이 원고로 최종 확정</button></div>`}
body+=evidence(`<p><b>제목 대안</b> · ${pack().titles.slice(1).map(safe).join(' / ')}</p><p><b>썸네일 대안</b> · ${pack().thumbs.slice(1).map(safe).join(' / ')}</p><p>Draft A/B는 고정된 시연 원고이며, 웹 데모에서는 실제 AI 비평을 실행하지 않습니다.</p>`)+link(2,'영상 방향')}
else{body=`<h2>최종 대본이 준비됐습니다</h2><p class="hint">선택한 예시 원고 전체입니다. 아래에서 Markdown으로 저장할 수 있습니다.</p><div class="manuscript">${safe(finalScript||draft(false))}</div><div class="actions"><button class="primary" onclick="download()">Markdown 저장</button></div>${evidence('<p>이 원고는 가상 예시이며 실제 AI로 생성한 결과가 아닙니다.</p>')}${link(0,'처음부터 다시 체험')}`}
root.innerHTML=body}
render();</script></body></html>
