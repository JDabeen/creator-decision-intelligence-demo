const SCRIPT_SAMPLES={"A0":{"A":["영어 문장이 길어지면 갑자기 머릿속이 하얘지시나요? 짧은 문장은 아는데, 단어가 몇 개 더 붙는 순간 어디서부터 읽어야 할지 모르겠다는 분들이 많습니다. 오늘은 문장을 처음부터 끝까지 외우지 않고, 뼈대를 먼저 찾는 연습을 해보겠습니다.","“I bought a book at the bookstore yesterday.” 천천히 다시 보세요. 누가 했죠? I, 내가. 뭘 했죠? bought, 샀다. 뭘 샀죠? a book, 책 한 권을. 여기까지가 기본 뼈대입니다. 뒤의 at the bookstore는 장소, yesterday는 시간이에요.","그럼 직접 해보겠습니다. “나는 어제 서점에서 책을 샀다.” 영어로 먼저 “I bought a book.”이라고 말해보세요. 됐다면 “at the bookstore”, 마지막으로 “yesterday”를 붙여보세요. 다 한 번에 말하지 않아도 됩니다.","오늘은 긴 문장을 세 부분으로 나눠 봤습니다. 누가, 무엇을 했다, 무엇을. 그 뒤에 장소와 시간을 붙일 수 있다는 것만 기억하세요."],"B":["여러분, “I bought a book.” 여기까지는 어렵지 않죠? 그런데 뒤에 at the bookstore yesterday가 붙으면, 갑자기 긴 영어 문장처럼 느껴집니다. 왜 그럴까요? 단어가 어려워서가 아니라, 정보를 한꺼번에 처리하려고 하기 때문일 수 있습니다. 오늘은 30초만에 그 부담을 줄여볼게요.","먼저 딱 세 단어 묶음만 봅니다. “I bought a book.” 내가 책을 샀다. 이것만으로 이미 완성된 문장이에요. 이제 “at the bookstore.” 어디에서? 서점에서. 마지막 “yesterday.” 언제? 어제. 긴 문장을 외운 게 아니라, 짧은 문장에 정보를 두 조각 더 붙인 겁니다.","이번에는 제가 한국어로 말할게요. “나는 커피를 샀다.” “I bought coffee.” “카페에서.” “at a cafe.” “오늘 아침에.” “this morning.” 천천히 연결해 볼까요? “I bought coffee at a cafe this morning.” 맞습니다. 어려운 문법 이름을 몰라도, 정보가 붙는 자리를 느끼면 문장이 길어집니다.","자, 이제 처음의 문장으로 돌아갑니다. “I bought a book at the bookstore yesterday.” 더 이상 긴 덩어리로 보이지 않죠? 무엇을 했는지, 어디에서, 언제. 오늘부터 긴 영어를 만나면 **뼈대 먼저, 정보는 나중에** 확인해 보세요. 지금 한 문장을 끝까지 만들어낸 것이 오늘의 성과입니다."]},"A1":{"A":["영어 소리를 들었는데 아는 단어가 하나도 안 들린 것 같은 경험 있으시죠? 오늘은 내 리스닝이 어디에서 막히는지 세 단계로 확인해 보겠습니다.","먼저 이 문장을 들어보세요. “What do you want to do?” 뜻은 “뭘 하고 싶으세요?”입니다. 글자로 보면 what, do, you, want, to, do를 다 알고 있는데, 빠르게 들으면 단어 사이가 붙어서 낯설게 느껴질 수 있어요.","진단은 간단합니다. 첫째, 소리만 듣고 의미를 알아본다. 둘째, 자막을 보고 어떤 단어가 있었는지 확인한다. 셋째, 자막을 덮고 같은 문장을 다시 듣는다. 자막을 본 뒤 들리기 시작했다면, 아예 모르는 단어의 문제만은 아닐 수 있습니다.","오늘은 듣기 문제를 세 가지로 나눠 봤습니다. 단어를 모르는지, 소리가 붙어서 낯선지, 아니면 의미를 따라가는 속도가 느린지. 다음에 못 들리는 문장을 만나면 먼저 어디에서 막혔는지 확인해 보세요."],"B":["“분명히 아는 단어인데 왜 들을 때는 모르겠지?” 오늘 이 질문을 해결해 보겠습니다. 지금부터 같은 문장을 두 번 들을 거예요. 이해가 안 된다고 바로 포기하지 마세요. 오늘 목표는 리스닝 실력이 갑자기 좋아지는 게 아니라, **내가 어디에서 막히는지 알아내는 것**입니다.","문장은 “What do you want to do?”입니다. “당신은 무엇을 하고 싶으세요?”라는 뜻이죠. 화면으로 보면 대부분 읽을 수 있을 겁니다. 그런데 자연스러운 대화에서는 여러 단어가 매끄럽게 이어져, 책에서 보던 모습과 다르게 들립니다. 발음은 사람마다 다르지만, 중요한 건 단어 사이에 매번 쉬는 시간이 있는 게 아니라는 사실이에요.","첫 번째 테스트입니다. 소리만 듣고 무슨 뜻인지 말해보세요. 두 번째, 문장을 눈으로 읽고 의미를 확인합니다. 세 번째, 자막을 보지 않고 다시 들어보세요. 처음에는 안 들렸는데 이제 들리나요? 그렇다면 소리의 연결을 익히는 연습이 도움이 될 수 있습니다. 여전히 뜻이 생각나지 않나요? 그때는 단어와 표현 자체를 먼저 익혀야 할 수도 있어요.","마지막 확인입니다. 아까 그 질문 “What do you want to do?”를 한 번 더 들어보세요. 이제 필요한 연습이 무엇인지 조금 더 분명해졌나요? **못 듣는 이유를 먼저 나누고, 그 이유에 맞게 연습하는 것.** 오늘 가져갈 건 바로 이 기준입니다."]},"A2":{"A":["오늘도 영어 공부할 시간이 없으셨나요? 길게 공부하기 어렵다면 질문 하나로 10분을 채워보겠습니다. 준비물은 영어 문장 하나뿐입니다.","오늘 질문은 “What do you do after work?” 퇴근하고 무엇을 하세요?입니다. 먼저 아주 짧게 “I cook dinner.” 저녁을 만들어요. 여기서 끝내지 말고, “I cook dinner for my family.” 우리 가족을 위해 만든다고 한 가지를 더 붙여보세요.","이제 같은 질문에 내 대답을 만들어 보세요. “I take a walk.” 산책해요. “I watch TV.” TV 봐요. 좋아하는 표현 하나만 선택해도 됩니다. 그리고 상대방에게 “How about you?”라고 되물어보세요.","오늘은 질문 하나, 대답 한 문장, 정보 한 조각, 되묻기까지 했습니다. 10분 연습은 여기서 마칩니다."],"B":["10분도 시간이 없어서 영어를 못 한다고 느껴지시나요? 사실 오늘은 열 개의 문장을 외우지 않을 겁니다. **질문 하나에 내 대답을 만드는 연습**만 해볼게요. 그 한 문장이 대화에서 나올 수 있으면, 오늘 10분은 충분히 의미 있습니다.","제가 먼저 묻겠습니다. “What do you do after work?” 퇴근하고 뭐 하세요? 이때 멋진 대답은 필요 없습니다. “I cook dinner.” 저녁 만들어요. 이것만 말해도 대답은 끝난 겁니다. 자, 이제 정보를 하나 붙여볼게요. “I cook dinner with my husband.” 남편과 저녁을 만들어요. 여러분이라면 with my family, at home처럼 바꿀 수도 있겠죠.","여기서 대화가 한 번 더 이어지게 하는 표현이 있습니다. “How about you?” 당신은요? 자, 제가 다시 질문할게요. “What do you do after work?” 여러분은 짧게 답하고, 정보 하나를 더하고, 마지막에 “How about you?”라고 물어보세요. 시간을 드릴게요. 세 문장을 완벽하게 말하려고 하지 말고 멈추지 않는 연습을 해보세요.","첫 질문으로 돌아가겠습니다. “What do you do after work?” 조금 전보다 대답이 자연스럽게 나오나요? 질문 하나, 짧은 대답, 한마디 더, 그리고 되묻기. **내일은 같은 틀에 질문만 바꿔보세요.** 새로운 문장 열 개보다, 오늘 실제로 말해본 한 문장이 남을 수 있습니다."]},"H0":{"A":["영어 동사 get을 외울 때 “얻다” 하나만 기억하면 막히는 경우가 많습니다. 오늘은 get을 어떤 변화의 도착점으로 생각해 보겠습니다.","“I get home at six.” 여섯 시에 집에 도착해요. “I get tired after work.” 퇴근하면 피곤해져요. 하나는 장소에 도착하고, 다른 하나는 상태가 바뀌었습니다. 둘 다 get이 어떤 결과에 이르는 느낌으로 쓰였죠.","직접 말해볼게요. “나는 일곱 시에 집에 도착해요.” “I get home at seven.” “나는 저녁에 피곤해져요.” “I get tired in the evening.” 다른 의미의 get을 두 번 썼습니다.","오늘은 get을 단어 뜻 하나로만 외우지 않고, 문장에서 일어나는 변화를 함께 봤습니다. 다음 문장을 만나면 그 결과가 무엇인지 찾아보세요."],"B":["get은 ‘얻다’라고 외웠는데 “I get home”은 왜 집을 얻는다는 뜻이 아닐까요? 이런 순간이 오면 영어가 갑자기 어려워집니다. 오늘은 get의 뜻을 더 많이 외우기보다, **문장 안에서 결과가 어떻게 달라지는지** 느껴보겠습니다.","첫 번째는 “I get home at six.”입니다. 여섯 시에 집에 도착합니다. 여기서는 내가 어느 장소에 이른 거죠. 두 번째는 “I get tired after work.” 퇴근하고 피곤해집니다. 여기서는 내 상태가 피곤한 쪽으로 바뀌었습니다. get이 항상 같은 한국어 한 단어로 번역되는 건 아니지만, 어떤 상태나 지점에 이르는 모습을 떠올리면 이해가 쉬워질 때가 있습니다.","이제 제가 상황을 줄게요. 일을 끝내고 집 문 앞에 도착했습니다. “I get home.” 그 뒤로 피곤해졌어요. “I get tired.” 마지막으로 잠들기 전에는 “I get sleepy.” 졸리게 돼요. 세 문장을 천천히 이어서 말해보세요. 장소가 하나, 상태가 둘입니다. 뜻을 세 개 따로 외우기 전에 장면을 떠올리며 말하는 거예요.","처음 질문으로 돌아가 보겠습니다. “I get home”이 왜 ‘집을 얻는다’가 아니었죠? 문장 전체에서 어디에 도착하거나 어떤 상태가 되는지를 보는 것이 더 도움이 되기 때문입니다. 오늘은 get의 모든 용법을 끝낸 것이 아니라, **새로운 get 문장을 만날 때 스스로 해석할 수 있는 실마리 하나**를 얻었습니다."]},"H1":{"A":["영어 어순을 공부했는데 실제 대화에서는 문장이 안 나오시나요? 오늘은 가장 단순한 문장에 정보를 붙여보겠습니다.","“I bought coffee.” 나는 커피를 샀다. 여기에 “at a cafe”를 붙이면 카페에서 샀고, “this morning”을 붙이면 오늘 아침에 샀다는 뜻입니다. “I bought coffee at a cafe this morning.”이 됩니다.","이제 제가 묻겠습니다. “What did you buy?” 무엇을 샀나요? “I bought coffee.” “Where?” 어디에서요? “At a cafe.” “When?” 언제요? “This morning.” 짧게 대답해도 됩니다.","오늘은 영어 어순을 시험문제로만 풀지 않고, 질문에 맞게 정보를 꺼내는 데 사용했습니다. 한 문장만 말하더라도 실제 대화로 연결해 보세요."],"B":["영어 어순을 이해했다는 것과, 대화 중에 그 어순을 바로 꺼내는 것은 조금 다른 일입니다. 오늘은 제가 질문하는 사람이고 여러분이 대답하는 사람입니다. **정답을 읽는 게 아니라 직접 말해보는 3턴 챌린지**를 해보겠습니다.","먼저 기본 문장 하나를 준비합니다. “I bought coffee.” 커피를 샀어요. 여기까지 됐다면 충분합니다. 첫 질문입니다. “What did you buy?” 무엇을 샀나요? 바로 말해보세요. “I bought coffee.” 두 번째 질문, “Where did you buy it?” 어디서 샀나요? “At a cafe.” 세 번째 질문, “When did you buy it?” 언제 샀나요? “This morning.” 여기까지 세 번 답하셨죠?","이제 잘게 나눈 답을 하나로 묶어보겠습니다. “I bought coffee at a cafe this morning.” 길어 보이지만 새로 만든 말은 없습니다. 아까 세 질문에 이미 대답했거든요. 다시 한번 제 질문에 답해보세요. “What did you buy?” “Where?” “When?” 이번엔 답을 연결해서 한 번에 말해보세요.","처음에는 어순 규칙이 머리에서만 돌았습니다. 지금은 질문에 대답하고, 그 답을 한 문장으로 연결했습니다. **주어와 동사로 시작해 필요한 장소·시간만 덧붙이는 것.** 오늘 그 차이를 직접 느끼셨다면 챌린지는 성공입니다."]},"H2":{"A":["영어를 삼 일 하다가 그만두셨나요? 의지가 약해서라고만 생각하지 마세요. 시작할 일이 너무 크면 다시 하기 어려울 수 있습니다.","오늘은 30일 공부 계획을 아주 작게 시작해 보겠습니다. 하루 목표는 문장 하나를 소리 내서 세 번 말하는 것입니다. 예를 들어 “I take a walk every morning.” 나는 매일 아침 산책해요.","어제 연습한 문장을 오늘 다시 한 번 말하고, 오늘 문장 하나를 추가합니다. 종이에 날짜와 실제로 말한 횟수를 체크해 보세요. 시간이 부족한 날은 문장 하나만 말해도 됩니다.","30일 동안 매일 새로운 문장 30개를 외워야 하는 건 아닙니다. 작은 행동을 반복하고, 실제로 얼마나 했는지 기록해 보세요."],"B":["영어 공부를 시작할 때 가장 어려운 건 첫날이 아니라, 일주일 뒤에 다시 책을 펴는 일일 수 있습니다. 오늘은 ‘매일 한 시간’ 같은 큰 목표 대신, **30일 동안 계속할 수 있는 아주 작은 실험**을 함께 설계해 볼게요.","첫날은 문장 하나입니다. “I take a walk every morning.” 나는 매일 아침 산책해요. 이 문장을 소리 내서 세 번 말합니다. 그게 전부예요. 둘째 날은 어제 문장을 한 번 말하고, 오늘 내 생활에 맞는 문장을 하나 골라봅니다. “I drink coffee after lunch.” 점심 먹고 커피를 마셔요. 이렇게 이미 한 말을 짧게 꺼내는 연습을 먼저 합니다.","중요한 건 달력에 동그라미를 그리는 것보다, 실제로 어떤 행동을 했는지 체크하는 겁니다. 종이에 ‘날짜, 말한 문장, 소리 낸 횟수’ 세 칸을 만들어 보세요. 하루를 놓쳤다면 다음 날 그대로 이어가면 됩니다. 한 번 비었다고 처음부터 다시 시작할 필요는 없습니다.","30일 뒤에 모든 영어가 유창해질 거라고 약속하지는 않겠습니다. 대신 오늘 여러분은 작은 실험을 시작할 수 있습니다. “I take a walk every morning.” 지금 세 번 말해보세요. **계획을 크게 세우는 것보다, 오늘 실제로 입을 움직인 한 번**이 더 분명한 출발점입니다."]}};
function draft(b){
 const s=SCRIPT_SAMPLES[choice]||SCRIPT_SAMPLES['A0'];
 const paragraphs=s[b?'B':'A'].slice();
 // Reflect the selected research direction through an actual spoken practice prompt.
 const directions={
   1:'여기서 한 가지 확인할게요. 영어를 말하다 멈춰도 괜찮습니다. 지금 들은 예문을 처음부터 외우려고 하지 말고, 어디에서 막혔는지 찾아 그 부분만 다시 말해보세요.',
   2:'이제 이 문장을 실제 대화라고 생각해보세요. 상대가 묻는 질문을 듣고 짧게 답한 다음, 알고 있는 정보를 하나만 더 붙여보세요. 다음 질문까지 이어가면 충분합니다.'
 };
 if(direction!==0)paragraphs.splice(Math.max(2,paragraphs.length-1),0,directions[direction]);
 return paragraphs.join('\n\n').replace(/\*\*/g,'');
}
function link(stepTo,text){return `<button class="back" onclick="go(${stepTo})">← ${text}</button>`}
function evidence(content){return `<div class="bottom"><details><summary>판단 근거 · 데이터 보기</summary><div class="details-copy">${content}</div></details></div>`}
function go(n){step=n;window.scrollTo(0,0);render()}
function setGoal(v){goal=v;render()}
function setChoice(v){if(choice!==v){choice=v;built=false;showB=true;finalScript=''}render()}
function setDirection(v){if(direction!==v){direction=v;built=false;showB=true;finalScript=''}render()}
function createB(){built=true;showB=true;render()}
function viewB(v){showB=v;render()}
function confirmDraft(){finalScript=draft(built&&showB);go(4)}
function download(){let a=document.createElement('a');let u=URL.createObjectURL(new Blob([finalScript],{type:'text/markdown;charset=utf-8'}));a.href=u;a.download='demo_final_script.md';a.click();setTimeout(()=>URL.revokeObjectURL(u),700)}
function render(){let body='';const rec=selected();
if(step===0){body=`<div class="hero"><h1>내 채널에 맞는 다음 주제 찾기</h1></div>
<div class="goal">${['신규 유입','신뢰 형성'].map(x=>`<button class="${goal===x?'selected':''}" onclick="setGoal('${x}')">${x}</button>`).join('')}</div>
<div class="chat"><textarea id="topic" placeholder="어떤 주제를 고민하고 있나요?"></textarea><div class="actions"><button class="primary" onclick="go(1)">주제 찾기 ↑</button></div></div>`}
else if(step===1){const a=all().filter(x=>x.source==='A'),b=all().filter(x=>x.source==='B');const cards=items=>items.map(x=>`<label class="topic ${x.key===choice?'on':''}"><input type="radio" name="candidate" ${x.key===choice?'checked':''} onchange="setChoice('${x.key}')"><span>${safe(x.rank)}순위 · ${safe(x.title)}</span></label>`).join('');body=`<h2>다음 영상, 무엇을 만들까요?</h2><div class="group">A · 내 채널 분석</div>${cards(a)}<div class="group">B · 외부 웹 조사</div>${cards(b)}<p class="hint">${safe(rec.reason).slice(0,170)}</p><div class="actions"><button class="primary" onclick="go(2)">이 주제 심층 조사</button></div>${evidence(`<p><b>선정 이유</b> · ${safe(rec.reason)}</p><p><b>비교</b> · ${safe(rec.tradeoff)}</p><p>검색량·예상 조회수로 검증된 결과는 아닙니다.</p>`)}${link(0,'주제 찾기')}`}
else if(step===2){body=`<h2>영상 방향 선택</h2><div class="pick">${safe(rec.title)}</div><div class="group">이 영상을 만드는 방향</div>${dirItems.map((d,i)=>`<label class="topic ${direction===i?'on':''}"><input type="radio" name="direction" onchange="setDirection(${i})" ${direction===i?'checked':''}><span>${i+1}. ${safe(d[0])}</span></label>`).join('')}<div class="pick">${safe(dirItems[direction][1])}</div><div class="actions"><button class="primary" onclick="go(3)">이 방향으로 대본 만들기</button></div>${evidence('<p>시장 영상과 자막 수치는 모두 시연용 데이터입니다. 실제 수집은 수행하지 않았습니다.</p>')}${link(1,'주제 비교')}`}
else if(step===3){body=`<h2>대본 확인</h2><p class="hint">실제 말하듯 읽을 수 있는 주제별 예시 대본입니다. AI 호출 없이 작동합니다.</p><div class="draft-title">${safe(rec.title)}</div>`;
if(!built){body+=`<div class="actions"><button class="primary" onclick="createB()">Draft B 만들기</button></div><h3 class="scripthead">Draft A · 예시 원고</h3><div class="manuscript">${safe(draft(false))}</div>`}
else{body+=`<div class="goal"><button class="${!showB?'selected':''}" onclick="viewB(false)">Draft A</button><button class="${showB?'selected':''}" onclick="viewB(true)">Draft B</button></div><div class="manuscript">${safe(draft(showB))}</div><div class="actions"><button class="primary" onclick="confirmDraft()">이 원고로 최종 확정</button></div>`}
body+=evidence('<p>Draft B는 도입 문제 회수, 즉시 수행 연습, 완결형 마무리를 강화한 예시입니다. 실제 AI 비평은 작동하지 않습니다.</p>')+link(2,'영상 방향')}
else{body=`<h2>최종 대본이 준비됐습니다</h2><p class="hint">선택한 예시 원고 전체입니다. 아래에서 Markdown으로 저장할 수 있습니다.</p><div class="manuscript">${safe(finalScript||draft(false))}</div><div class="actions"><button class="primary" onclick="download()">Markdown 저장</button></div>${evidence('<p>이 원고는 가상 예시이며 실제 AI로 생성한 결과가 아닙니다.</p>')}${link(0,'처음부터 다시 체험')}`}
root.innerHTML=body}
render();</script></body></html>
