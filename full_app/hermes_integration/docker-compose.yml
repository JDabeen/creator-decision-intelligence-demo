name: youtube-consultant-hermes
services:
  gateway:
    image: nousresearch/hermes-agent@sha256:c56a1bd108e94c850cc785b5c7142b6f1633066b2306f15a9438d698a3be0077
    command: ["gateway", "run"]
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: "${OPENAI_API_KEY:?OPENAI_API_KEY is required}"
      TAVILY_API_KEY: "${TAVILY_API_KEY:-}"
      EXA_API_KEY: "${EXA_API_KEY:-}"
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: "${HERMES_GATEWAY_KEY:?HERMES_GATEWAY_KEY is required}"
    volumes:
      - type: bind
        source: "${HERMES_DATA_DIR:?HERMES_DATA_DIR is required}"
        target: /opt/data
    ports:
      - "127.0.0.1:8642:8642"
    cap_drop: ["ALL"]
    # Official image uses s6 setup and needs a few filesystem capabilities.
    cap_add: ["CHOWN", "FOWNER", "DAC_OVERRIDE", "SETUID", "SETGID", "KILL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 4g
    shm_size: 512m  # container-local browser shared memory; no host browser sharing
    cpus: 2.0
    # Deliberately NO: Windows personal paths, project files, Docker socket,
    # privileged mode, dashboard, remote port publishing or host networking.
